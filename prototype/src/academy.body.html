<title>C-Life 学前大课堂</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 布局：顶栏（品牌 / 主导航 / 身份切换 / 引导演示）→ 单页视图区；手机宽度改为底部标签栏。配色：柳绿主色、紫荆强调 */
:root{
  --paper:#f3f6f4; --surface:#ffffff; --ink:#16302b; --muted:#5b716b; --line:#d6e0dc;
  --willow:#1f6b5c; --willow-soft:#e2efea; --bauhinia:#b0306f; --bauhinia-soft:#f7e3ed;
  --ok:#2f7d4f; --ok-soft:#e3f2e8; --warn:#a35f00; --warn-soft:#fbefd9; --idle:#7b8a86; --idle-soft:#eceff0;
  --board:#fbfcfa; --chalk:#2b3a36; --tour:#16302b; --tour-ink:#f3f6f4;
  --shadow:0 1px 2px rgba(22,48,43,.06),0 6px 20px rgba(22,48,43,.06);
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f1a18;--surface:#16231f;--ink:#e4efeb;--muted:#9db3ac;--line:#2a3c37;
  --willow:#5fbfa6;--willow-soft:#1d3530;--bauhinia:#ef7fb2;--bauhinia-soft:#3a1f2c;
  --ok:#6fcf93;--ok-soft:#1c3427;--warn:#f0b357;--warn-soft:#3a2c14;--idle:#8a9995;--idle-soft:#22302c;
  --board:#1b2a26;--chalk:#dfeae6;--tour:#e4efeb;--tour-ink:#0f1a18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1a18;--surface:#16231f;--ink:#e4efeb;--muted:#9db3ac;--line:#2a3c37;
  --willow:#5fbfa6;--willow-soft:#1d3530;--bauhinia:#ef7fb2;--bauhinia-soft:#3a1f2c;
  --ok:#6fcf93;--ok-soft:#1c3427;--warn:#f0b357;--warn-soft:#3a2c14;--idle:#8a9995;--idle-soft:#22302c;
  --board:#1b2a26;--chalk:#dfeae6;--tour:#e4efeb;--tour-ink:#0f1a18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:26px;font-weight:900}
h2{font-size:20px;font-weight:900}
h3{font-size:16px;font-weight:700}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--bauhinia);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);min-width:0}
.stack{display:grid;gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:10px;padding:9px 16px;font-weight:700;font-size:14px;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--bauhinia);color:var(--surface)}
.btn.ghost{background:var(--willow-soft);color:var(--willow)}
.btn.line{background:var(--surface);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--willow);border-color:var(--willow);color:var(--surface);font-weight:700}
.chip:hover{border-color:var(--willow)}
.pill{font-size:12px;padding:2px 10px;border-radius:999px;font-weight:500;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.idle{background:var(--idle-soft);color:var(--idle)}
.pill.hot{background:var(--bauhinia-soft);color:var(--bauhinia)}
.link{color:var(--bauhinia);font-weight:700;text-decoration:none;font-size:13px;background:none;border:0;padding:0;white-space:nowrap}
.link:hover{text-decoration:underline}

/* 顶栏 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:17px;white-space:nowrap;text-decoration:none}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.04em;line-height:1.2}
nav.main{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
nav.main a{text-decoration:none;padding:6px 10px;border-radius:8px;color:var(--muted);font-size:14px;white-space:nowrap}
nav.main a[aria-current="page"]{color:var(--willow);background:var(--willow-soft);font-weight:700}
nav.main a:hover{color:var(--ink)}
.idbox{display:flex;align-items:center;gap:8px;white-space:nowrap}
.idbox select{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--surface);color:var(--ink);max-width:180px}
.avatar{width:32px;height:32px;flex:none;border-radius:50%;background:var(--willow);color:var(--surface);display:grid;place-items:center;font-weight:700;font-size:14px}
.tourbtn{border:0;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;background:var(--bauhinia);color:var(--surface);white-space:nowrap}
.tourbtn.off{background:var(--idle-soft);color:var(--ink)}
.protoband{background:var(--bauhinia-soft);color:var(--bauhinia);font-size:12px}
.protoband .wrap{display:flex;justify-content:space-between;gap:12px;padding-block:5px;flex-wrap:wrap}
.protoband button{background:none;border:0;color:inherit;font-size:12px;text-decoration:underline;padding:0}

main{padding-block:22px 48px}
.tabbar{display:none}

/* 首页 */
.hero-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:20px;align-items:start}
.greet{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.stats{display:flex;gap:20px}
.stat b{display:block;font-family:var(--f-num);font-size:22px;color:var(--willow)}
.stat span{font-size:12px;color:var(--muted)}
.map-wrap{overflow-x:auto;padding-bottom:6px}
.map{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(78px,1fr);min-width:100%}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;background:none;border:0;padding:4px 2px;text-align:center}
.node::before{content:"";position:absolute;top:22px;left:-50%;width:100%;height:3px;background:var(--line);z-index:0}
.node:first-child::before{display:none}
.node.done::before,.node.current::before{background:var(--willow)}
.dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-num);font-size:14px;position:relative;z-index:1;border:2px solid var(--line);background:var(--surface);color:var(--idle)}
.node.done .dot{background:var(--willow);border-color:var(--willow);color:var(--surface)}
.node.current .dot{border-color:var(--bauhinia);color:var(--bauhinia);box-shadow:0 0 0 5px var(--bauhinia-soft)}
.node .t{font-size:12px;line-height:1.35;color:var(--muted);max-width:86px}
.node.current .t{color:var(--ink);font-weight:700}
.next{margin-top:18px;border-top:1px solid var(--line);padding-top:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.segs4{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.seg4{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--paper);color:var(--muted)}
.seg4.on{background:var(--willow);color:var(--surface)}

.probes{list-style:none;margin:0;padding:0;display:grid}
.probe{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.probe:first-child{border-top:0}
.sd{width:10px;height:10px;border-radius:50%;margin-top:6px;display:inline-block}
.sd.ok{background:var(--ok)}.sd.warn{background:var(--warn)}.sd.idle{background:var(--idle)}
.probe small,.sub{display:block;color:var(--muted);font-size:12px}

.block{margin-top:28px}
.block-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.block-head p{font-size:13px;color:var(--muted)}
.lessons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0;text-align:left;padding:0}
.lesson:hover{border-color:var(--willow)}
.thumb{aspect-ratio:16/9;max-width:100%;width:100%;background:var(--willow-soft);display:grid;place-items:center;position:relative}
.thumb svg{width:58%;height:auto}
.thumb .dur{position:absolute;right:8px;bottom:8px;font-family:var(--f-num);font-size:11px;background:var(--surface);color:var(--ink);padding:1px 6px;border-radius:6px}
.thumb .lk{position:absolute;left:8px;top:8px}
.lesson .body{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1;width:100%}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;padding:1px 8px;border-radius:6px;background:var(--paper);color:var(--muted)}
.tag.role{background:var(--willow-soft);color:var(--willow)}
.lesson h3{font-size:14px}
.lesson .foot{font-size:12px;color:var(--muted);margin-top:auto}
.row3{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.live{background:var(--willow);color:var(--surface);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px}
.live .when{font-family:var(--f-num);font-size:13px;opacity:.85}
.live h3{font-size:19px;font-weight:900}
.live p{font-size:14px;opacity:.92}
.live .btn{background:var(--surface);color:var(--willow);align-self:flex-start}
.files{list-style:none;padding:0;margin:0;display:grid}
.file{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.file:first-child{border-top:0}
.ext{width:40px;height:36px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-num);font-size:10px;font-weight:500;background:var(--willow-soft);color:var(--willow)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-weight:500;color:var(--muted);text-align:left;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.num{text-align:right}
.scroll{overflow-x:auto}

/* 关卡页 */
.lv-head{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.goal{font-size:14px;color:var(--muted);margin-top:6px;max-width:62ch}
.rule{font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;max-width:380px}
.rule b{color:var(--willow)}
.crumb{font-size:13px;color:var(--muted);margin-bottom:12px}
.crumb a{text-decoration:none}
.crumb a:hover{color:var(--ink)}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:18px}
.step{display:flex;gap:10px;align-items:center;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-width:0}
.step .k{width:32px;height:32px;flex:none;border-radius:9px;display:grid;place-items:center;font-weight:900;background:var(--willow-soft);color:var(--willow)}
.step b{display:block;font-size:14px}
.step small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step>div{min-width:0}
.step[aria-selected="true"]{border-color:var(--bauhinia);box-shadow:0 0 0 3px var(--bauhinia-soft)}
.step.done .k{background:var(--willow);color:var(--surface)}
.step.lock{opacity:.55}
.lv-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.board{background:var(--board);border:1px solid var(--line);border-radius:12px;aspect-ratio:16/9;max-width:100%;position:relative;overflow:hidden}
.board svg{width:100%;height:100%;display:block}
.board .sk{fill:none;stroke:var(--chalk);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.board .hl{fill:none;stroke:var(--bauhinia);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.board .gw{fill:none;stroke:var(--willow);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.board .draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw var(--dur,1s) ease-out forwards;animation-delay:var(--delay,0s)}
@keyframes draw{to{stroke-dashoffset:0}}
.board text{fill:var(--chalk);font-family:var(--f-body);font-size:15px}
.board text.hlt{fill:var(--bauhinia);font-weight:700}
.subtitle{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(92%,640px);text-align:center;background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;font-size:14px;box-shadow:var(--shadow)}
.player{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.bar{flex:1;min-width:140px;height:6px;background:var(--line);border-radius:6px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--willow);border-radius:6px}
.scenes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
.scene{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;text-align:left;font-size:13px;min-width:0}
.scene b{display:block;font-family:var(--f-num);font-size:11px;color:var(--muted);font-weight:500}
.scene[aria-current="true"]{border-color:var(--willow);background:var(--willow-soft)}
.screen{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.chrome{display:flex;gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--paper);font-size:12px;color:var(--muted)}
.chrome i{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}
.app{display:grid;grid-template-columns:170px minmax(0,1fr);min-height:280px;font-size:13px}
.side{border-right:1px solid var(--line);padding:10px 0;background:var(--paper)}
.side div{padding:6px 14px;color:var(--muted)}
.side .grp{color:var(--ink);font-weight:700;margin-top:6px}
.side .on{color:var(--willow);background:var(--willow-soft);font-weight:700}
.amain{padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fb{border:1px solid var(--line);border-radius:6px;padding:3px 10px;font-size:12px;background:var(--surface);white-space:nowrap}
.fb.pri{background:var(--willow);color:var(--surface);border-color:var(--willow)}
.ftbl{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ftr{display:grid;grid-template-columns:1.1fr 1fr 1.4fr .9fr;gap:8px;padding:7px 10px;border-top:1px solid var(--line)}
.ftr:first-child{border-top:0;background:var(--paper);color:var(--muted)}
.ftr span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fform{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fform label{font-size:12px;color:var(--muted)}
.fform .f{border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--paper);font-size:12px;min-height:26px}
.ring{outline:3px solid var(--bauhinia);outline-offset:2px;border-radius:6px}
.chapters{display:grid;gap:6px;margin-top:12px}
.chap{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;text-align:left;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.chap b{font-family:var(--f-num);font-size:12px;color:var(--muted);font-weight:500}
.chap[aria-current="true"]{border-color:var(--bauhinia);background:var(--bauhinia-soft)}
.checklist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.checklist li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;align-items:start;font-size:14px;padding:10px 12px;background:var(--paper);border-radius:10px}
.checklist .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-num);font-size:12px;background:var(--willow-soft);color:var(--willow)}
.verify{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding:14px;border-radius:12px;border:1px dashed var(--line)}
.verify .ico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--idle-soft);color:var(--idle);font-weight:900}
.verify.passed{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.verify.passed .ico{background:var(--ok);color:var(--surface)}
.verify code{font-family:var(--f-num);font-size:12px;background:var(--surface);padding:1px 6px;border-radius:5px}
.q{padding:14px;border-radius:12px;background:var(--paper);display:grid;gap:8px}
.q .t{font-weight:700}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.opt:hover{border-color:var(--willow)}
.opt .l{font-family:var(--f-num);color:var(--muted);flex:none}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--warn);background:var(--warn-soft)}
.explain{font-size:13px;padding:10px 12px;border-radius:10px;background:var(--surface);border-left:3px solid var(--willow)}
.done-card{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 18px;border-radius:14px;background:var(--willow);color:var(--surface);margin-top:16px}
.done-card .big{font-family:var(--f-num);font-size:26px}
.done-card .btn{background:var(--surface);color:var(--willow)}
.lockmsg{padding:18px;border-radius:12px;background:var(--paper);font-size:14px;display:grid;gap:10px;justify-items:start}
.points{margin:0;padding-left:18px;display:grid;gap:8px;font-size:14px}
.qa{display:grid;gap:12px;font-size:13px}
.qa .a{background:var(--paper);border-radius:10px;padding:8px 10px;margin-top:4px}
.ask{display:flex;gap:8px;margin-top:12px}
.ask input,textarea,.inp{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:14px;background:var(--surface);color:var(--ink)}
textarea{width:100%;min-height:90px;resize:vertical}

/* 其他页 */
.page-head{margin-bottom:18px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-head p{color:var(--muted);font-size:14px;margin-top:4px;max-width:64ch}
.filters{display:grid;gap:8px;margin-bottom:16px}
.filters .row span{font-size:12px;color:var(--muted);min-width:36px}
.paths{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.lvlist{list-style:none;margin:12px 0 0;padding:0;display:grid}
.lvlist button{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;padding:8px 4px;border:0;border-top:1px solid var(--line);background:none;font-size:14px}
.lvlist li:first-child button{border-top:0}
.lvlist .ix{font-family:var(--f-num);font-size:12px;color:var(--muted)}
.weeks{display:flex;gap:4px}
.weeks i{width:14px;height:14px;border-radius:4px;display:inline-block}
.weeks i.ok{background:var(--ok)}.weeks i.warn{background:var(--warn)}.weeks i.idle{background:var(--idle-soft);border:1px solid var(--line)}
.badges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.badge{border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;display:grid;gap:6px;justify-items:center;background:var(--surface)}
.badge .b{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:18px;background:var(--idle-soft);color:var(--idle)}
.badge.on .b{background:var(--willow);color:var(--surface)}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kv div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.kv b{display:block;font-family:var(--f-num);font-size:22px;color:var(--willow)}
.kv span{font-size:12px;color:var(--muted)}

/* 提示与引导条 */
.toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--tour);color:var(--tour-ink);padding:8px 16px;border-radius:999px;font-size:13px;z-index:80;max-width:calc(100% - 32px);text-align:center}
.tourbar{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;width:min(760px,calc(100% - 32px));background:var(--tour);color:var(--tour-ink);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.tourbar .s{font-family:var(--f-num);font-size:12px;opacity:.7;white-space:nowrap}
.tourbar .x{font-size:13.5px;line-height:1.55}
.tourbar .nav{display:flex;gap:6px}
.tourbar button{border:0;border-radius:8px;padding:6px 12px;font-size:13px;background:rgba(127,127,127,.25);color:inherit}
.tourbar button.pri{background:var(--bauhinia);color:var(--surface);font-weight:700}

@media (max-width:960px){
  .hero-grid,.row3,.lv-layout{grid-template-columns:minmax(0,1fr)}
  .lessons{grid-template-columns:repeat(2,minmax(0,1fr))}
  .badges,.kv{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:720px){
  nav.main,.idbox .who{display:none}
  .top .wrap{gap:10px}
  .brand{flex:1;min-width:0}
  .brand span{overflow:hidden;text-overflow:ellipsis}
  .avatar,.tourbtn .tx{display:none}
  .idbox select{max-width:124px}
  main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabbar a{text-decoration:none;text-align:center;font-size:11px;color:var(--muted);display:grid;justify-items:center;gap:2px;padding:4px 0}
  .tabbar a svg{width:22px;height:22px}
  .tabbar a[aria-current="page"]{color:var(--willow);font-weight:700}
  .tourbar{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
  .tourbar{grid-template-columns:minmax(0,1fr)}
  .paths{grid-template-columns:minmax(0,1fr)}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
  .scenes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .ftr{grid-template-columns:1fr 1fr 1fr}
  .ftr span:nth-child(3){display:none}
  .fform{grid-template-columns:minmax(0,1fr)}
  .done-card,.next{grid-template-columns:minmax(0,1fr)}
  h1{font-size:22px}
  .subtitle{font-size:12px}
}
@media (max-width:480px){.lessons,.badges{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){.board .draw{animation:none;stroke-dashoffset:0}}

        <div class="ftbl" id="sTbl"><div class="ftr"><span>对象</span><span>班级</span><span>情况</span><span>操作</span></div><div class="ftr"><span>示例幼儿 A</span><span>中二班</span><span>${l.featured?'午餐进食少':'待处理'}</span><span>${l.featured?'登记疾病':'查看'}</span></div><div class="ftr"><span>示例幼儿 B</span><span>大一班</span><span>${l.featured?'户外后咳嗽':'已完成'}</span><span>${l.featured?'登记疾病':'查看'}</span></div></div>
        <div class="fform" id="sForm" hidden><div><label>${l.featured?'观察幼儿':'对象'}</label><div class="f">示例幼儿 C · 小一班</div></div><div><label>${l.featured?'观察老师':'填写人'}</label><div class="f">${ROLES[ST.role].label.split(' · ')[0]}</div></div><div><label>时间</label><div class="f num">14:40</div></div><div><label>${l.featured?'检查信息':'内容'}</label><div class="f">${l.featured?'体温 37.8℃，精神差':'按页面提示填写'}</div></div>
          <div id="sDis" style="grid-column:1/-1" hidden><label>登记疾病 · 追踪情况</label><div class="f">发热待查；已通知家长，16:00 复测</div></div><div style="grid-column:1/-1;display:flex;justify-content:flex-end"><span class="fb pri" id="sSave">保存</span></div></div>
      </div></div></div>
      <div class="chapters">${ch.map((c,k)=>`<button type="button" class="chap" data-chap="${k}" data-target="${c[2]}"><b>${c[0]}</b><span>${k+1}. ${esc(c[1])}</span></button>`).join('')}</div>
      <p class="muted small" style="margin-top:10px">录屏使用演示园与虚构数据，不含真实幼儿信息。</p>
      <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn primary" data-seg="zuo">下一段：平台实操</button></div></section>`;}
  if(locked&&(seg==='zuo'||seg==='ce'))return `<section class="panel"><div class="lockmsg"><b>实操与测验在解锁后开放</b><span class="small">当前进度：第 ${ST.prog[p]+1} 关。先完成前面的关卡，或继续看本关的微课与录屏。</span><button class="btn primary" data-go="level-${p}-${ST.prog[p]+1}">去第 ${ST.prog[p]+1} 关</button></div></section>`;
  if(seg==='zuo'){const done=st.zuo||s==='done',steps=stepsOf(p,i);
    return `<section class="panel stack"><div><p class="eyebrow">实操任务</p><h2 style="font-size:18px">在本园账号完成：${esc(l.event)}</h2></div>
      <ul class="checklist">${steps.map((x,k)=>`<li><span class="n">${k+1}</span><div>${esc(x)}</div></li>`).join('')}</ul>
      <div class="verify ${done?'passed':''}"><span class="ico">${done?'✓':'…'}</span><div><b>${done?'已收到平台回传'+(st.zuoAt?' · '+st.zuoAt:''):'等待平台回传'}</b><p class="muted small">${done?'本段已通过。':`完成上面 ${steps.length} 步后，平台回传 <code>${esc(l.event)}</code>，本段自动通过。`}</p></div></div>
      <div class="row">${done?'':`<a class="btn line" href="https://campus.lzpreschool.cn/ulogin" target="_blank" rel="noopener">打开平台</a><button class="btn ghost" id="simBtn" type="button">模拟平台回传（原型演示）</button>`}<button class="btn primary" data-seg="ce">下一段：即时测验</button></div>
      <p class="muted small">本园暂无可操作的数据，或尚未分班？可以在演示园完成，结果同样计入。</p></section>`;}
  const qs=qsOf(p,i),done=s==='done';
  return `<section class="panel stack" id="quiz">${qs.map((q,qi)=>`<div class="q"><p class="eyebrow">第 ${qi+1} 题</p><p class="t">${esc(q.t)}</p>${q.o.map((o,oi)=>`<button type="button" class="opt ${done&&o[1]?'right':''}" data-q="${qi}" data-o="${oi}"><span class="l">${'ABCD'[oi]}</span><span>${esc(o[0])}</span></button>`).join('')}<div class="explain" id="ex-${qi}" ${done?'':'hidden'}>${done?esc(q.o.find(o=>o[1])[2]):''}</div></div>`).join('')}
    <div id="doneSlot">${passCard(p,i)}</div></section>`;
}
function passCard(p,i){
  const st=lvState(p,i),tot=PATHS[p].length;
  if(!st.passedAt)return '';
  return `<div class="done-card"><span class="big">+1</span><div><b>第 ${i+1} 关通过</b><p class="small" style="opacity:.9">${PATHN[p]}路径 ${Math.min(ST.prog[p],tot)}/${tot}${i+1<tot?' · 第 '+(i+2)+' 关「'+esc(PATHS[p][i+1].t)+'」已解锁':' · 岗位徽章已获得'}</p></div>${i+1<tot?`<button class="btn" data-go="level-${p}-${i+2}">进入第 ${i+2} 关</button>`:`<a class="btn" href="#me">查看徽章</a>`}</div>`;
}
function tryPass(p,i){
  const st=lvState(p,i),qs=qsOf(p,i);
  if(st.zuo&&st.right.length>=qs.length&&!st.passedAt&&status(p,i)==='current'){
    const d=new Date();st.passedAt=`${d.getMonth()+1} 月 ${d.getDate()} 日`;
    ST.prog[p]=i+1;ST.credits[p]+=1;save();
    toast(`第 ${i+1} 关通过，学分 +1`);return true;}
  return false;
}

/* ════════════════ 交互绑定 ════════════════ */
const NS='http://www.w3.org/2000/svg';let bTimer=null;
function drawScene(p,i,k,anim){
  const svg=$('#boardSvg');if(!svg)return;const sc=sceneOf(p,i),x=sc[k];VIEW.scene=k;clearTimeout(bTimer);
  svg.innerHTML='';
  let draws=x.draw,labels=x.labels||[];
  if(!draws){ // 通用分镜：按步骤画流程，高亮当前步
    const n=sc.length,w=Math.min(150,520/n-20),gap=(600-n*w)/(n+1);draws=[];labels=[];
    for(let j=0;j<n;j++){const x0=gap+j*(w+gap);draws.push([j===k?'hl':'sk',`M${x0} 120h${w}v70h-${w}z`]);if(j<n-1)draws.push(['sk',`M${x0+w+6} 155h${gap-12}M${x0+w+gap-14} 148l8 7-8 7`]);labels.push([x0+w/2-10,162,String(j+1),j===k]);}
    draws.push(['gw',`M${gap+k*(w+gap)+w/2-30} 220h60`]);
  }
  const per=anim?2.2/draws.length:0;
  draws.forEach(([c,d],j)=>{const e=document.createElementNS(NS,'path');e.setAttribute('d',d);e.setAttribute('class',c+(anim?' draw':''));svg.appendChild(e);
    if(anim){const L=Math.ceil(e.getTotalLength());e.style.setProperty('--len',L);e.style.setProperty('--delay',(j*per)+'s');e.style.setProperty('--dur',Math.max(.4,per*1.4)+'s');}});
  labels.forEach(([lx,ly,t,h])=>{const e=document.createElementNS(NS,'text');e.setAttribute('x',lx);e.setAttribute('y',ly);if(h)e.setAttribute('class','hlt');e.textContent=t;svg.appendChild(e);});
  const sub=$('#subtitle');sub.textContent=x.subs[0];if(anim&&x.subs[1])bTimer=setTimeout(()=>sub.textContent=x.subs[1],1800);
  const total=l=>l.featured?100:sc.length*25;const T=total(PATHS[p][i]);const end=x.end*T/100;
  $('#barFill').style.width=x.end+'%';$('#timeLbl').textContent=`${Math.floor(end/60)}:${String(Math.round(end%60)).padStart(2,'0')} / ${Math.floor(T/60)}:${String(T%60).padStart(2,'0')}`;
  document.querySelectorAll('.scene').forEach((b,j)=>b.setAttribute('aria-current',j===k));
}
function setChap(k,target){
  document.querySelectorAll('.chap').forEach((b,j)=>b.setAttribute('aria-current',j===k));
  document.querySelectorAll('.ring').forEach(e=>e.classList.remove('ring'));
  const form=target==='form'||target==='disease';$('#sForm').hidden=!form;$('#sTbl').hidden=form;$('#sDis').hidden=target!=='disease';
  const el=target==='menu'?document.querySelector('.side .on'):target==='btn'?$('#sBtn'):target==='form'?$('#sSave'):$('#sDis');
  if(el)el.classList.add('ring');VIEW.chap=k;
}
function after(r){
  if(r.v==='level'){const {p,i}=r,st=lvState(p,i);
    if(st.seg==='jiang'){const n=sceneOf(p,i).length;drawScene(p,i,Math.min(VIEW.scene,n-1),false);}
    if(st.seg==='kan'){const b=document.querySelectorAll('.chap'),k=Math.min(VIEW.chap,b.length-1);setChap(k,b[k].dataset.target);}
  }
  if(TOUR.on)paintTour();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a');if(!t)return;const r=parse();
  if(t.tagName==='A'){const h=t.getAttribute('href')||'';if(h.startsWith('#')){e.preventDefault();VIEW.seg=null;go(h.slice(1)||'home');}return;}
  if(t.dataset.go){e.preventDefault();VIEW.seg=null;go(t.dataset.go);return;}
  if(t.dataset.seg&&r.v==='level'){const st=lvState(r.p,r.i);st.seg=t.dataset.seg;VIEW.seg=null;VIEW.scene=0;VIEW.chap=0;save();render();$('#stage').scrollIntoView({block:'nearest'});return;}
  if(t.dataset.sceneI!==undefined){drawScene(r.p,r.i,+t.dataset.sceneI,true);return;}
  if(t.id==='playBtn'){drawScene(r.p,r.i,VIEW.scene,true);return;}
  if(t.dataset.chap!==undefined){setChap(+t.dataset.chap,t.dataset.target);return;}
  if(t.id==='simBtn'){const st=lvState(r.p,r.i);st.zuo=true;const d=new Date();st.zuoAt=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;tryPass(r.p,r.i);save();render();return;}
  if(t.dataset.q!==undefined){const qi=+t.dataset.q,oi=+t.dataset.o,q=qsOf(r.p,r.i)[qi],o=q.o[oi],st=lvState(r.p,r.i);
    t.parentElement.querySelectorAll('.opt').forEach(x=>x.classList.remove('right','wrong'));t.classList.add(o[1]?'right':'wrong');
    const ex=$('#ex-'+qi);ex.hidden=false;ex.innerHTML=esc(o[2])+(o[1]?'':` <button class="link" data-seg="${q.jump}">回看${q.jump==='kan'?'录屏':'微课'}</button>`);
    st.right=st.right.filter(x=>x!==qi);if(o[1])st.right.push(qi);
    const passed=tryPass(r.p,r.i);save();
    if(passed){render();setTimeout(()=>{const d=$('#doneSlot');d&&d.scrollIntoView({block:'nearest'})},30);}
    else{const n=qsOf(r.p,r.i).length;const tab=document.querySelector('.step[data-seg="ce"] small');if(tab)tab.textContent=st.right.length+'/'+n;
      if(st.right.length>=n&&!st.zuo){ex.insertAdjacentHTML('beforeend','<br><b>测验全部答对。</b>完成平台实操后即可通关。');}}
    return;}
  if(t.dataset.probe!==undefined){const pr=PROBES[+t.dataset.probe];if(pr.go[0]==='local'){go('local');return;}
    const [p,i]=pr.go;if(ROLES[ST.role].path!==p&&ST.role!=='director'){toast(`该关卡推送给${PATHN[p]}，已切换到对应身份查看`);ST.role=Object.keys(ROLES).find(k=>ROLES[k].path===p);save();}
    go(`level-${p}-${i+1}`);return;}
  if(t.dataset.viewas){ST.role=Object.keys(ROLES).find(k=>ROLES[k].path===t.dataset.viewas);save();toast('已切换为'+ROLES[ST.role].label);go('home');return;}
  if(t.dataset.live!==undefined){const k=+t.dataset.live;ST.live[k]=!ST.live[k];save();toast(ST.live[k]?'已预约，开播前 30 分钟提醒':'已取消预约');render();return;}
  if(t.dataset.lesrole){VIEW.lesRole=t.dataset.lesrole;render();return;}
  if(t.dataset.scene){VIEW.libScene=t.dataset.scene;render();return;}
  if(t.dataset.librole){VIEW.libRole=t.dataset.librole;render();return;}
  if(t.dataset.file){toast('原型：「'+t.dataset.file+'」预览');return;}
  if(t.dataset.toast){toast(t.dataset.toast);return;}
  if(t.dataset.copy){const v=t.dataset.copy;try{navigator.clipboard.writeText(v).then(()=>toast('已复制 '+v),()=>sel());}catch(err){sel();}
    function sel(){const s=window.getSelection(),rg=document.createRange();rg.selectNodeContents($('#tel'));s.removeAllRanges();s.addRange(rg);toast('已选中号码，可手动复制');}return;}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='askForm'){const i=$('#askInput');if(!i.value.trim())return;const [p,ix]=f.dataset.k.split('-');ST.asked.push({k:p+'-'+ix,q:i.value.trim()});save();toast('已提交，值守时段内回复');render();return;}
  if(f.dataset.drill!==undefined){const k=+f.dataset.drill,v=$('#drill-'+k).value.trim();if(!v){toast('先写下你的做法再提交');return;}ST.drill[k]=v;save();toast('已提交，讲师点评后可能获得 2 学分');render();return;}
  if(f.id==='ticketForm'){const d=$('#tkDev').value.trim(),x=$('#tkTxt').value.trim();if(!d){toast('请填写设备与位置');return;}ST.tickets.unshift({id:'GD-'+(1300+ST.tickets.length),t:d+(x?'：'+x:''),s:'处理中'});save();toast('报修已提交，24 小时内协调处理');render();return;}
});
$('#roleSel').addEventListener('change',e=>{ST.role=e.target.value;save();toast('已切换为'+ROLES[ST.role].label);if(parse().v==='level')go('home');else render();});
$('#resetBtn').addEventListener('click',()=>{const r=ST.role;ST=FRESH();ST.role=r;save();toast('演示进度已重置');tstop();go('home');});

/* ════════════════ 引导演示 ════════════════ */
const TOUR={on:false,i:0,steps:[
 {h:'home',role:'nurse',x:'这是<b>保健医李老师</b>登录后的首页：左边是本岗位的 12 关路径和下一关，右边是本园应用体检，体检发现的问题会推送对应关卡。'},
 {h:'checkup',role:'nurse',x:'体检每周一自动生成，共 12 项。<b>疾病管理</b>连续需关注，系统推荐保健医第 8 关；<b>设备离线</b>直接引到报修。'},
 {h:'level-nurse-6',role:'nurse',seg:'jiang',x:'进入第 6 关。每关分<b>讲、看、做、测</b>四段。白板微课按字幕顺序出画，点「播放本幕」可以看到效果。'},
 {h:'level-nurse-6',role:'nurse',seg:'kan',x:'操作录屏用演示园和虚构数据。点右边的章节，界面切到对应步骤，红框标出要点的位置。'},
 {h:'level-nurse-6',role:'nurse',seg:'zuo',x:'实操在真实平台完成，平台回传后本段自动通过。原型里点<b>「模拟平台回传」</b>。'},
 {h:'level-nurse-6',role:'nurse',seg:'ce',x:'三道情景题，答错立即解释并可回看。实操回传和测验都完成后通关，学分 +1，下一关解锁。'},
 {h:'home',role:'nurse',pass:['nurse',5],x:'回到首页，路径进度、学分和下一关都已更新。'},
 {h:'home',role:'director',x:'切换为<b>园长</b>：上面是园长自己的 6 关路径，下面是各岗位路径完成情况与体检汇总，可以据此生成补训通知。'},
 {h:'level-director-3',role:'director',seg:'jiang',x:'园长路径第 3 关「全园指标」：读懂出勤、因病缺勤、晨检覆盖、食谱发布，找出需要关注的班级。指标只用于园内改进，不做排名。'}
]};
function tstart(){TOUR.on=true;TOUR.i=0;$('#tourBtn').innerHTML='◼<span class="tx"> 退出引导</span>';$('#tourBtn').classList.add('off');tgo();}
function tstop(){TOUR.on=false;$('#tourbar').hidden=true;$('#tourBtn').innerHTML='▷<span class="tx"> 引导演示</span>';$('#tourBtn').classList.remove('off');}
function tgo(){const s=TOUR.steps[TOUR.i];if(ST.role!==s.role){ST.role=s.role;save();}
  if(s.pass){const [p,i]=s.pass,st=lvState(p,i);if(status(p,i)==='current'){st.zuo=true;st.right=qsOf(p,i).map((_,k)=>k);tryPass(p,i);}}
  if(s.seg){const m=s.h.match(/level-(\w+)-(\d+)/);lvState(m[1],+m[2]-1).seg=s.seg;VIEW.seg=s.seg;VIEW.scene=0;VIEW.chap=0;}
  go(s.h);}
function paintTour(){const s=TOUR.steps[TOUR.i],n=TOUR.steps.length,b=$('#tourbar');b.hidden=false;
  b.innerHTML=`<span class="s">${TOUR.i+1} / ${n}</span><span class="x">${s.x}</span><span class="nav"><button type="button" id="tPrev" ${TOUR.i?'':'disabled'}>上一步</button>${TOUR.i<n-1?'<button type="button" class="pri" id="tNext">下一步</button>':'<button type="button" class="pri" id="tEnd">完成</button>'}</span>`;
  const pv=$('#tPrev');if(pv)pv.onclick=()=>{TOUR.i--;tgo();};const nx=$('#tNext');if(nx)nx.onclick=()=>{TOUR.i++;tgo();};const en=$('#tEnd');if(en)en.onclick=tstop;}
$('#tourBtn').addEventListener('click',()=>TOUR.on?tstop():tstart());

render();
</script>
