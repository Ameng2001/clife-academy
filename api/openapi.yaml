# openGym HTTP API: hand-written OpenAPI 3.1 spec.
# Source of truth: api/server.js (a single framework-free Node file). Every route the
# server registers is documented here; if you add a route there, add it here too.
# Browsable version: https://opengym.ch/api.html
openapi: 3.1.0

info:
  title: openGym API
  version: 1.4.1
  summary: Passkey (WebAuthn) auth + per-user state storage for openGym
  description: |
    The backend of [openGym](https://opengym.ch), a free, open-source
    gym & body-weight tracker. A plain Node server, no framework, JSON-file storage,
    HMAC-signed session cookies.

    ### Authentication
    Sign-in is by **passkey** (WebAuthn, via `@simplewebauthn/server`). A successful
    `register/verify` or `login/verify` sets the session cookie; every authenticated
    route then works with that cookie. The paired mobile app has no shared cookie jar,
    so it redeems a short pairing code (`/api/pair/redeem`) for the *same* signed token
    and sends it as `Authorization: Bearer <token>` instead.

    An instance started with `PASSWORD_LOGIN=1` also offers **name-and-password
    sign-in** (tag `password`): opt-in per profile, scrypt-hashed, throttled, with an
    admin-issued one-time reset code instead of e-mail. A profile may also add an e-mail
    address to sign in with instead of its name (`/api/account/email`); no mail is ever
    sent to it. Its routes set exactly the same cookie. With the flag off (the default)
    every one of them answers 404.

    ### Throttling
    The `password` routes are counted per client address: at most 60 requests a minute
    across them, and wrong answers (a password, a reset code, an invite code on password
    signup, an e-mail address already in use) pause the address from the 21st on, for 30 s,
    doubling up to 15 min. Wrong passwords also pause the *account* they were tried
    against from the 6th on, for 1 min doubling up to 1 h (the same pause whether the account
    was named by its name or its e-mail), and an identifier that names no account is
    paused the same way, as typed. A password check counts from the moment it
    starts, so checks sent at once get no more tries than checks sent one by one. A
    paused caller gets `429 {"error": …, "code": "locked", "retryAfter": <s>}` with a
    `Retry-After` header. Passkey sign-up and sign-in and the pairing routes are not
    throttled (their failures reach the audit log at most ten a minute per address).
    The two routes that redeem a one-time device link (tag `passkeys`) share
    the per-address budget, and wrong codes pause the address for link redemption only,
    from the 21st on, the way wrong reset codes do. Adding or removing a passkey in Settings
    (`POST /api/account/passkeys/options`, `DELETE /api/account/passkeys`) and making a
    device code (`POST /api/account/device-link`) spend the per-address budget too, and a
    current password given there as proof counts like one given at sign-in.
    The address is the socket's, or with `TRUST_PROXY=1` the one a trusted proxy put in
    `CF-Connecting-IP` / the last `X-Forwarded-For` entry / `X-Real-IP`; IPv6 clients are
    counted by /64. Counters live in memory and reset on restart.

    ### Sessions
    The cookie/bearer value is `<payload>.<hmac>` where the payload is
    `<uid>:<expiry-ms>:<session-version>`, signed with a per-instance secret
    (HMAC-SHA256). Sessions last `SESSION_DAYS` (default 90). `POST /api/logout/all`
    bumps the user's session version, which invalidates every token ever issued for
    the account.

    ### CSRF
    State-changing browser requests must come from the app's own origin. The server
    checks `Sec-Fetch-Site` (falling back to `Origin` vs the configured `ORIGIN`);
    a mismatch is refused with `403 {"error":"cross-origin request refused"}` on any
    non-GET route. Exempt: passkey sign-up and sign-in (`register/options`,
    `register/verify`, `login/options`, `login/verify`) and `pair/redeem`, each of which
    carries its own one-shot credential in the body, and any request authenticated with a
    Bearer token.
    The password routes are **not** exempt: a hostile page knows a valid name and
    password of its own, and could otherwise sign a visitor into it (login CSRF).
    Neither are the device-link routes: a link is redeemed on the app's own origin,
    the only one a passkey can be created for.

    ### Environment-dependent behavior
    - `INVITE_ONLY=1`: registration requires a valid invite code (minted by an admin).
    - `ALLOW_GUEST=0`: hides the client-side "continue without account" mode; the
      server merely reports the flag via `GET /api/config` (guest mode never talks to
      this API at all).
    - `ADMIN_UIDS=<uid>,<uid>`: user ids treated as admins (a `"admin": true` flag on
      the user record in `db.json` works too). Admins get the `/api/admin/*` routes.
    - `FIRST_USER_ADMIN` (default off; `1` turns it on): the first profile registered
      on an instance with no profiles gets that `"admin": true` flag. Decided at
      registration only, never applied to an instance that already has profiles.
    - `AUDIT_LOG` (default on), `AUDIT_MAX` (default 5000 events), `AUDIT_DAYS`
      (default 90), `AUDIT_IP` (`off` | `net` | `full`, default off) shape the audit
      log served by `GET /api/admin/audit`.
    - `PASSWORD_LOGIN=1`: adds the `password` routes and `password_login: true` in
      `GET /api/config`. Off by default.
    - `DEFAULT_LANG` (e.g. `pt-BR`; unset by default): `default_lang` in `GET /api/config`,
      the language of the sign-in screen and of every profile that never picked one.
    - `TRUST_PROXY=1`: the throttle reads the client address from proxy headers (set by
      the bundled `docker-compose.yml`, where only the web container can reach the API).
    - `MEDIA_UPLOADS` (default on; `0` removes the `media` routes and the `media` block of
      `GET /api/config`), `MEDIA_QUOTA_MB` (200 per profile, `0` = no cap),
      `MEDIA_IMAGE_MAX_MB` (2), `MEDIA_GIF_MAX_MB` (8), `MEDIA_VIDEO_MAX_MB` (40),
      `MEDIA_VIDEO_MAX_SEC` (60), `MEDIA_GC_GRACE_DAYS` (14), `MEDIA_UPLOADS_PER_HOUR` (600
      per profile), `MEDIA_MIN_FREE_MB` (512, `0` = no floor): photos and videos of custom
      exercises (tag `media`). Every MB here is 2^20 bytes.

    ### Conventions
    - Every response body is JSON with `Cache-Control: no-store`. The one exception is
      `GET /api/media/{hash}`, which answers with the stored file itself
      (`Cache-Control: private, no-store`).
    - Errors are always `{"error": "<human-readable message>"}`. The `password`, throttle and
      `media` routes add a stable `code` for the client to word in its own language.
    - Unknown method+path pairs return `404 {"error":"not found"}`; an unhandled
      exception returns `500 {"error":"server error"}`.
    - Request bodies are parsed as JSON regardless of Content-Type. A body that does
      not parse, or parses to anything but an object (`null`, a string, an array), is
      `400 {"error":"invalid json"}` on every route that reads one; an empty body counts
      as `{}`. A body over 5 MiB is `413 {"error":"body too large"}`; the rest of the
      upload is discarded so the answer reaches the client.
    - CORS: the request's `Origin` is reflected in `Access-Control-Allow-Origin`
      **without** `Allow-Credentials`, so cross-origin callers can only ever
      authenticate with a Bearer token, never with the cookie.
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
  contact:
    name: openGym
    url: https://gitlab.com/DuarteSantos8/opengym

servers:
  - url: /
    description: Same origin as the openGym web app (the normal deployment)
  - url: https://opengym.example.com
    description: Your self-hosted instance

tags:
  - name: meta
    description: Health and public configuration
  - name: auth
    description: Passkey (WebAuthn) registration and login, sessions
  - name: academy
    description: 大课堂登录：微信小程序、平台账号、开发桩（api/auth/）。没开的入口是 404。
  - name: pairing
    description: Mobile-app pairing (code from a signed-in browser tab)
  - name: password
    description: >-
      Optional name-and-password sign-in (`PASSWORD_LOGIN=1`). Every route here is a 404
      while the flag is off.
  - name: passkeys
    description: >-
      More than one passkey on a profile: list, add, rename, remove, plus one-time device
      links, which let another device of the same person add a passkey of its own.
  - name: data
    description: Per-user state sync (the whole app state as one JSON blob)
  - name: push
    description: Web Push (VAPID) subscriptions, rest-timer and test pushes
  - name: activity
    description: Live-workout presence heartbeat
  - name: admin
    description: Admin dashboard. Requires an admin session (`ADMIN_UIDS` or `admin:true`)
  - name: media
    description: >-
      The photo, GIF or video of a user's own custom exercise, and the photos and videos
      attached to a logged workout. Stored per profile (one quota for both) and named
      by the SHA-256 of its bytes; the state only carries a `MediaRef`. Every route here is a
      404 when the instance runs with `MEDIA_UPLOADS=0`.
  - name: coach
    description: >-
      AI Coach: plans, reviews and debriefs. Every route here answers 503 unless the
      instance has the Coach switched on and a provider connected.

security:
  - cookieAuth: []
  - bearerAuth: []

paths:
  /api/health:
    get:
      tags: [meta]
      operationId: getHealth
      summary: Health check
      description: |
        Always public. Also reports how many user accounts exist.

        The check writes: it creates and removes one empty file under `DATA_DIR`,
        because a server whose data directory is full or read-only has every write
        path broken while the port still answers. It is a 503 when that fails — the
        container healthcheck (`wget --spider`) reads the status and nothing else.

        The probe runs at most once every five seconds and the answer in between is
        the last one, so a poll can be that stale. The route is unauthenticated, and
        one disk write per request is not something to leave open to anyone.
      security: []
      responses:
        '200':
          description: The server is up and its data directory is writable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }
                  users:
                    type: integer
                    description: Number of registered user accounts.
                  writable: { type: boolean, const: true }
              example: { ok: true, users: 7, writable: true }
        '503':
          description: >-
            The data directory could not be written — a full disk, or a mount that
            came back read-only. Nothing that stores anything will work until it is
            fixed; the reason is in the container log.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: false }
                  writable: { type: boolean, const: false }
              example: { ok: false, writable: false }

  /api/config:
    get:
      tags: [meta]
      operationId: getConfig
      summary: Instance configuration
      description: |
        The flags the login screen needs before anyone is signed in. Both reflect
        environment variables on the server (`INVITE_ONLY`, `ALLOW_GUEST`), and so does
        `password_login`, which is there only when `PASSWORD_LOGIN=1`, and `default_lang`,
        which is there only when `DEFAULT_LANG` is set.

        `media` is there unless the instance runs with `MEDIA_UPLOADS=0`, for everybody: the
        caps are not a secret, and its absence is how the app knows this server does not
        store photos and videos at all.

        A caller with a valid session also gets a `coach` key: the block when the
        instance has the AI Coach switched on **and** a provider connected, and `null`
        when it has not. A caller with no session gets no key at all. The block names
        the provider this instance talks to, which is the same fact
        `GET /api/coach/disclosure` will not hand out unauthenticated.

        The key is always present for a session, `null` included, so a client that
        caches this answer can tell "no Coach on this instance" from "you were not
        signed in when you asked" and knows whether asking again would change it.
      security: []
      responses:
        '200':
          description: Instance flags, plus the Coach block for a signed-in caller.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invite_only:
                    type: boolean
                    description: When true, registration requires a valid invite code.
                  allow_guest:
                    type: boolean
                    description: >-
                      When false, the client hides "continue without account".
                      Guest mode is purely client-side and never calls this API.
                  coach:
                    description: >-
                      Present for a signed-in caller and absent otherwise; `null` when this
                      instance has no Coach enabled and connected. Every Coach entry point
                      in the client hangs off the block being there.
                    type: ['object', 'null']
                    properties:
                      enabled: { type: boolean, const: true }
                      provider:
                        type: string
                        description: Provider id, e.g. `anthropic`, `compatible`, `fixture`.
                      providerLabel: { type: string, description: Human-readable provider name. }
                      authMode:
                        type: string
                        enum: [instance, profile]
                        description: Whose credential the jobs spend.
                      community:
                        type: boolean
                        description: Whether "compare with others" is offered on this instance.
                  password_login:
                    type: boolean
                    const: true
                    description: >-
                      Present (and true) only when the instance runs with
                      PASSWORD_LOGIN=1; the client then offers name-and-password
                      sign-in next to passkeys.
                  default_lang:
                    type: string
                    example: pt-BR
                    description: >-
                      Present only when the instance runs with DEFAULT_LANG set: the
                      language tag the sign-in screen, and every profile that has never
                      picked a language in Settings, starts in. A profile's own choice
                      always wins; a tag the app has no translation for is ignored.
                  media:
                    $ref: '#/components/schemas/MediaConfig'
              examples:
                anonymous: { value: { invite_only: true, allow_guest: false } }
                signedInNoCoach: { value: { invite_only: true, allow_guest: false, coach: null } }
                signedIn:
                  value:
                    invite_only: true
                    allow_guest: false
                    coach: { enabled: true, provider: compatible, providerLabel: "OpenAI-compatible endpoint", authMode: instance, community: false }
                passwordLogin: { value: { invite_only: true, allow_guest: false, password_login: true } }
                media: { value: { invite_only: false, allow_guest: true, media: { imageMB: 2, gifMB: 8, videoMB: 40, videoSec: 60, quotaMB: 200, workouts: true } } }

  /api/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Who am I?
      description: |
        Resolves the current session to a user. A paired phone (bearer token) whose token is
        past half of `SESSION_DAYS` also receives a fresh `token` to use from now on; it carries
        the account's current session version, so "sign out everywhere" revokes it like the old
        one. Cookie sessions never get one.
      responses:
        '200':
          description: A valid session.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/SessionUser' }
                  token: { type: string, description: 'Bearer sessions past half their lifetime only: the renewed token.' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/register/options:
    post:
      tags: [auth]
      operationId: registerOptions
      summary: 'Start passkey registration (WebAuthn ceremony, step 1)'
      description: |
        Returns `PublicKeyCredentialCreationOptions` (from
        `@simplewebauthn/server`'s `generateRegistrationOptions`) plus a challenge id
        `cid`. The client passes `options` to
        `navigator.credentials.create()` (or `@simplewebauthn/browser`'s
        `startRegistration`) and sends the result to `/api/register/verify` together
        with the `cid`. Challenges are one-shot and expire after 5 minutes.

        CSRF-exempt (the challenge is the credential). No session required.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 40
                  description: Display name for the new profile (trimmed, max 40 chars).
                code:
                  type: string
                  description: >-
                    Invite code, required (and validated) only when the instance
                    runs with INVITE_ONLY. Compared case-insensitively.
            example: { name: "Ada", code: "3F9C21A07B54D688" }
      responses:
        '200':
          description: Ceremony options.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cid:
                    type: string
                    description: One-shot challenge id, echo it back to /api/register/verify.
                  options:
                    $ref: '#/components/schemas/WebAuthnRegistrationOptions'
        '400':
          description: '`name` missing/empty.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "name required" }
        '403':
          description: Instance is invite-only and the code is missing, used, or revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "a valid invite code is required", code: "invite" }

  /api/register/verify:
    post:
      tags: [auth]
      operationId: registerVerify
      summary: 'Finish passkey registration (WebAuthn ceremony, step 2)'
      description: |
        Verifies the authenticator's attestation response against the stored
        challenge (`verifyRegistrationResponse`), creates the user + credential, and
        signs the caller in (sets the session cookie). On an invite-only instance the
        invite is re-checked and burned here. CSRF-exempt.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cid, credential]
              properties:
                cid:
                  type: string
                  description: The challenge id from /api/register/options.
                credential:
                  $ref: '#/components/schemas/WebAuthnRegistrationCredential'
      responses:
        '200':
          description: Registered and signed in. The session cookie is set.
          headers:
            Set-Cookie:
              description: >-
                Session cookie (`__Host-gymsid` on HTTPS deployments, `gymsid` over
                plain http). HttpOnly, SameSite=Lax, Max-Age = SESSION_DAYS.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/SessionUser' }
        '400':
          description: >-
            Challenge expired/replayed, or the attestation did not verify (wrong
            origin/RP ID, malformed response…). The message is human-readable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "challenge expired, try again", code: "challenge-expired" }
        '403':
          description: Invite-only and the code became invalid since step 1.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "invite code is no longer valid, ask for a new one", code: "invite" }
        '409':
          description: This credential id is already registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "credential already registered" }

  /api/login/options:
    post:
      tags: [auth]
      operationId: loginOptions
      summary: 'Start passkey login (WebAuthn ceremony, step 1)'
      description: |
        Returns `PublicKeyCredentialRequestOptions`
        (`generateAuthenticationOptions` with an empty `allowCredentials`; discoverable
        credentials / resident keys are required at registration, so the browser offers
        the user their passkeys itself) plus a one-shot challenge id `cid`.
        CSRF-exempt. Takes no request body.
      security: []
      responses:
        '200':
          description: Ceremony options.
          content:
            application/json:
              schema:
                type: object
                properties:
                  cid: { type: string }
                  options:
                    $ref: '#/components/schemas/WebAuthnAuthenticationOptions'

  /api/login/verify:
    post:
      tags: [auth]
      operationId: loginVerify
      summary: 'Finish passkey login (WebAuthn ceremony, step 2)'
      description: |
        Verifies the assertion (`verifyAuthenticationResponse`), updates the signature
        counter, and signs the caller in (sets the session cookie). CSRF-exempt.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cid, credential]
              properties:
                cid:
                  type: string
                  description: The challenge id from /api/login/options.
                credential:
                  $ref: '#/components/schemas/WebAuthnAuthenticationCredential'
      responses:
        '200':
          description: Signed in. The session cookie is set.
          headers:
            Set-Cookie:
              description: Session cookie (see /api/register/verify).
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/SessionUser' }
        '400':
          description: Challenge expired/replayed, or the assertion did not verify.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "not verified" }
        '403':
          description: The account has been disabled by an admin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "this account has been disabled", code: "disabled" }
        '404':
          description: The passkey's credential id is unknown to this instance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "unknown passkey, create a profile first", code: "unknown-credential" }
        '500':
          description: Credential exists but its user record is missing (corrupt db).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: "user missing" }

  /api/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sign out (this device)
      description: >-
        Clears the session cookie. Always succeeds: an invalid or missing session is
        a no-op. The token itself stays cryptographically valid until it expires; use
        /api/logout/all to revoke tokens.
      security: []
      responses:
        '200':
          description: Cookie cleared.
          headers:
            Set-Cookie:
              description: Expires the session cookie(s).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }

  /api/logout/all:
    post:
      tags: [auth]
      operationId: logoutAll
      summary: Sign out everywhere
      description: |
        Bumps the account's session version, which invalidates **every** cookie and
        Bearer token ever issued for it, on every device, including a copy someone
        walked off with. Passkeys are untouched; signing back in works immediately.
        Also clears the caller's own cookie. Unredeemed pairing codes for the account
        are voided too.
      responses:
        '200':
          description: All sessions revoked.
          headers:
            Set-Cookie:
              description: Expires the caller's session cookie(s).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/pair/create:
    post:
      tags: [pairing]
      operationId: pairCreate
      summary: Mint a pairing code for the mobile app
      description: |
        Called from an already signed-in browser tab (Settings → "Pair the mobile
        app"). Returns an 8-character code (alphabet without 0/O/1/I) the phone
        redeems within 5 minutes via /api/pair/redeem. One-shot. One live code per
        profile: minting a new one retires the previous one.
      responses:
        '200':
          description: A fresh pairing code.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: 8 chars from ABCDEFGHJKLMNPQRSTUVWXYZ23456789.
              example: { code: "K7WQ2MZP" }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/login/wechat:
    post:
      tags: [academy]
      operationId: academyLoginWechat
      summary: 微信小程序登录（code 换 openid）
      description: |
        小程序 `wx.login()` 的 code 换 openid（jscode2session），按 openid 找到或建立用户，发会话。
        网页侧拿 cookie，小程序拿 `token` 作 `Authorization: Bearer`。只在 `WX_APPID` 与 `WX_SECRET` 都设时存在。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: wx.login() 返回的 code }
                name: { type: string, description: 首次登录时的显示名，可省 }
      responses:
        '200': { description: 已登录。`{ user: { id, name, admin, academy }, token }` }
        '401': { description: code 无效或微信拒绝（`code` 为 `bad-code` 或 `wx:<errcode>`） }
        '502': { description: 微信没有应答 }
        '404': { description: 入口未开启 }
  /api/login/platform:
    post:
      tags: [academy]
      operationId: academyLoginPlatform
      summary: 平台账号登录（ticket 换档案，或 OAuth2 授权码）
      description: |
        `PLATFORM_AUTH_MODE=ticket`（默认）：把平台签发的一次性 ticket 发到 `PLATFORM_AUTH_URL` 验证；
        `oauth2`：用授权码到 `PLATFORM_OAUTH_TOKEN_URL` 换 access_token，再取 `PLATFORM_OAUTH_USERINFO_URL`。
        都按平台 uid 找到或建立用户，岗位与园所以平台为准。契约见 docs/PLATFORM-AUTH.md。平台未配置时是 404。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ticket: { type: string, description: ticket 模式 }
                code: { type: string, description: oauth2 模式的授权码 }
                redirect_uri: { type: string, description: oauth2 模式，与跳授权页时一致；省略用 PLATFORM_REDIRECT_URI }
      responses:
        '200': { description: 已登录。`{ user: { id, name, admin, academy }, token }` }
        '401': { description: 票据无效（`rejected`）或格式不对（`bad-ticket`） }
        '502': { description: 平台没有应答 }
        '404': { description: 入口未开启 }
  /api/login/dev:
    post:
      tags: [academy]
      operationId: academyLoginDev
      summary: 开发桩登录（DEV_LOGIN=1 才有）
      description: 名字＋岗位＋园所直接进，不验任何东西。生产环境绝不能开。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                role: { type: string, description: nurse / teacher / care / it / director 或中文岗位名 }
                org: { type: string }
      responses:
        '200': { description: 已登录 }
        '400': { description: 缺 name }
        '404': { description: 入口未开启 }
  /api/events:
    post:
      tags: [academy]
      operationId: academyPostEvents
      summary: 平台实操事件回传
      description: |
        平台（服务端到服务端，`Authorization: Bearer PLATFORM_EVENTS_KEY`）回传「某平台用户做了某件事」。事件名是闭合清单
        （`api/academy/events-data.js`，由课程包生成），不在清单上的拒收。单条 `{ uid, event, at?, ref?, id? }` 或批量 `{ events: [...] }`（≤100）。
        幂等：同用户同 `id` 只收一次；没 `id` 的按 `(event, ref)` 去重。契约见 docs/PLATFORM-EVENTS.md。
        `DEV_LOGIN=1` 时本人也能带会话给自己回传 `{ event }`（演示按钮），生产不开。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                uid: { type: string, description: 平台用户标识（平台调用时必填） }
                event: { type: string }
                at: { type: string, description: ISO 时间或毫秒，缺省为收到时间 }
                ref: { type: string, description: 平台侧记录 id }
                id: { type: string, description: 幂等键 }
                events: { type: array, items: { type: object } }
      responses:
        '200': { description: '`{ accepted, duplicates, rejected: [{ i, code }] }`；演示调用另带本人 `events`' }
        '400': { description: 事件名不在清单（unknown-event）、缺事件名、时间不合法、批量超限 }
        '401': { description: 既没有平台密钥也没有会话 }
        '403': { description: 有会话但 DEV_LOGIN 未开（platform-only） }
        '404': { description: 平台 uid 没有对应用户（no-user） }
    get:
      tags: [academy]
      operationId: academyListEvents
      summary: 本人收到的实操事件
      description: '`?since=<ms>` 只要收到时间在其后的，按收到时间升序，最多 500 条。每条带 `levels`：用到这个事件的关卡 id。'
      responses:
        '200': { description: '`{ events: [{ id, event, at, ref, src, received, levels }], now }`' }
        '401': { description: 未登录 }
  /api/cases:
    get:
      tags: [academy]
      operationId: academyCases
      summary: 案例库（已入库，登录可见）
      description: '`?q=&domain=&age=&use=direct|adapt|idea`。实名、全平台共享。'
      responses:
        '200': { description: '`{ cases, uses, ages, total }`' }
        '401': { description: 未登录 }
    post:
      tags: [academy]
      operationId: academyCaseSave
      summary: 自荐一个案例、从已通过的实践关作品推荐、改编别人的，或改自己的
      description: '`{ id?, title, domain, age?, use, text(≥50 字), files?, submissionId?, answerId?, adaptedFrom?: caseId|null, adaptNote? }`。教师自荐进「待园长同意」；园长交的或园长推荐本园教师已通过的作品 / 被精选的研讨作答进「待审核」。退回的改后再交。入库给作者 +2 学分。`adaptedFrom` 是改编来源（只能是已入库案例），对外给 `adaptedFrom`、`chain`（往上最多 5 级）、`adaptations`（改自这条的）；改编入库时给原案例记一次「用过，有效」。'
      responses:
        '200': { description: '`{ case }`' }
        '400': { description: 缺标题 / 领域，正文不足 50 字，作品未通过点评 }
        '403': { description: 不是自己的，或已入库；推荐别人的作品但不是本园园长 }
  /api/cases/mine:
    get:
      tags: [academy]
      operationId: academyCasesMine
      summary: 本人交的案例（含待同意、待审核、退回）
      responses:
        '200': { description: '`{ cases }`' }
  /api/cases/queue:
    get:
      tags: [academy]
      operationId: academyCasesQueue
      summary: 待办：园长看本园待同意的，审核人看待审核的
      responses:
        '200': { description: '`{ consent, pending, director, curator }`' }
        '403': { description: 既不是园长也不是审核人 }
  /api/cases/decide:
    post:
      tags: [academy]
      operationId: academyCaseDecide
      summary: 园长同意 / 审核人入库或退回
      description: '`{ id, action: consent | approve | reject, note? }`。退回必须写原因。审核人＝管理员或 `academy.curator`。'
      responses:
        '200': { description: '`{ case }`' }
        '400': { description: 状态不对、退回没写原因 }
        '403': { description: 没有权限 }
  /api/cases/delete:
    post:
      tags: [academy]
      operationId: academyCaseDelete
      summary: 删自己未入库的案例；审核人可删任何
      responses:
        '200': { description: '`{ ok }`' }
        '403': { description: 没有权限 }
  /api/cases/used:
    post:
      tags: [academy]
      operationId: academyCaseUsed
      summary: 「用过，有效」
      description: '`{ id, note? }`。只对已入库、不是自己的案例；一人一条。数只给分享者本人、本园园长与管理员看，不排行。'
      responses:
        '200': { description: '`{ case }`' }
        '403': { description: 自己的 }
  /api/me/honors:
    get:
      tags: [academy]
      operationId: academyMyHonors
      summary: 本人的勋章、荣誉称号与关卡以外的事件记录
      description: 勋章按记录算（路径完成、案例被采纳 1/5/20、精选 1/5、点评 20 次、带出一个人），不存；称号由园长或管理员授；学分台账记案例入库 +2、作答精选 +2。
      responses:
        '200': { description: '`{ badges, titles, credits, creditsTotal, titleNames }`' }
  /api/me/points:
    get:
      tags: [academy]
      operationId: academyMyPoints
      summary: 本人的积分（平台唯一的资产）
      description: '`{ points, levelsPassed, rules: { earn, interact }, tools, history }`。学（过关、走完路径、证书、实践关作品通过点评、结营）、贡献（案例 / 课程成果 / 赛作品入库、作答精选）、互动（被标用过有效、标别人并写一句、答疑采纳、点评、营帖）都自动记；过关在客户端进度里，读余额时对账补记。history 的 kind earn / interact / spend，sub 是事件名。不奖签到、时长、浏览、点赞。只本人可见、不排行、不可转赠。钱包页与教研工坊统一，学坊不单独做。'
      responses:
        '200': { description: 余额与流水 }
  /api/admin/points/rules:
    get:
      tags: [admin]
      operationId: adminPointsRules
      summary: 积分比例（管理员）
      responses:
        '200': { description: '`{ rules: { earn: { level, path, cert, practice, camp, case, work, drill, contest, adapted, lecture, shareday }, interact: { used, usedBy, adopted, review, campPost }, at, byName }, earnDefaults, interactDefaults, tools }`' }
    post:
      tags: [admin]
      operationId: adminSetPointsRules
      summary: 改积分规则，只影响之后的
      description: '`{ earn?: {…}, interact?: {…} }`。学与贡献 0–1000、互动 0–100，0 是不给。已记的积分不重算。'
      responses:
        '200': { description: '`{ rules }`' }
        '400': { description: rate 不是 1–100 的整数 }
  /api/points/balance:
    get:
      tags: [academy]
      operationId: academyPointsBalance
      summary: 工具服务端查余额（TOOLS_API_KEY）
      description: '`?uid=`。教研工坊、观察评价工具、贝果实验室的服务端带 `Authorization: Bearer <TOOLS_API_KEY>`。'
      responses:
        '200': { description: '`{ uid, name, orgName, points }`' }
        '403': { description: 没带工具密钥 }
  /api/points/spend:
    post:
      tags: [academy]
      operationId: academyPointsSpend
      summary: 工具服务端扣积分（TOOLS_API_KEY，幂等）
      description: '`{ uid, tool: workshop|observe|bagel, n, ref, note? }`。同一 (tool, ref) 只扣一次。'
      responses:
        '200': { description: '`{ ok, duplicate, points }`' }
        '409': { description: 余额不够 }
  /api/points/of:
    get:
      tags: [academy]
      operationId: academyPointsOf
      summary: 一个人的积分流水（管理员会话，或工坊钱包页带 TOOLS_API_KEY）
      description: '`?uid=`。钱包页与教研工坊统一，学坊不单独做：工坊的钱包页用这条取明细。'
      responses:
        '200': { description: 余额与流水 }
  /api/org/titles:
    get:
      tags: [academy]
      operationId: academyOrgTitles
      summary: 本园授过的称号（管理员看全部）
      responses:
        '200': { description: '`{ titles, titleNames }`' }
    post:
      tags: [academy]
      operationId: academyTitleGrant
      summary: 授荣誉称号（园长授本园的人，管理员授任何人）
      description: '`{ uid, title: seed|sharer|contest|studio|custom, label?(custom 用), reason(≥5 字) }`。不能授自己。颁发在大讲堂或园内活动上，这里只是记录。'
      responses:
        '200': { description: '`{ title }`' }
        '400': { description: 没选称号或没写理由 }
        '403': { description: 不是本园，或授自己 }
  /api/org/titles/revoke:
    post:
      tags: [academy]
      operationId: academyTitleRevoke
      summary: 撤回一个称号
      responses:
        '200': { description: '`{ ok }`' }
  /api/cases/curator:
    put:
      tags: [academy]
      operationId: academyCaseCurator
      summary: 管理员指定 / 取消案例库审核人
      description: '`{ uid, curator }`。审核人由本地运营方指定。'
      responses:
        '200': { description: '`{ id, curator }`' }
        '403': { description: 不是管理员 }
  /api/cases/file:
    get:
      tags: [academy]
      operationId: academyCaseFile
      summary: 案例附图
      description: '`?id=&hash=`。能看到这个案例的人可读。'
      responses:
        '200': { description: 文件 }
        '404': { description: 没有 }
  /api/checkup:
    post:
      tags: [academy]
      operationId: academyCheckupPush
      summary: 平台回传本周探针数（PLATFORM_EVENTS_KEY 或管理员）
      description: '`{ org:{id?|name}, week?, probes:{ disease, tickets, devices, fitness, morning, meals, accounts, basics, attendance, sleep, research } }` 或 `{ cards:[…] }`（≤ 50）。数是园级运行指标，不含任何幼儿数据。一园一周一条，后到的按键覆盖。'
      responses:
        '200': { description: '`{ accepted, rejected:[{ i, code }] }`' }
        '403': { description: 没带平台密钥也不是管理员 }
  /api/org/checkup:
    get:
      tags: [academy]
      operationId: academyOrgCheckup
      summary: 本园体检卡（园长、管理员）
      description: '`{ org, card:{ week, weeks, sum, probes:[{ key, name, status, text, weeks, consecutive, go, act }], recommendations, limited } }`。「学习」一项大课堂自己算；新上线园所前两周只开三项；连续两周需关注的项给对应岗位推荐关卡。'
      responses:
        '200': { description: 体检卡 }
        '403': { description: 不是园长 }
  /api/district/summary:
    get:
      tags: [academy]
      operationId: academyDistrictSummary
      summary: 区县看板（区县管理员、管理员）
      description: '`{ district, orgs:[{ key, name }], orgCount, members_total, finished, certified, passes7d, medians, domains:[{ key, name, median }], rateMedian, checkup:{ pushed, warn }, activity:{ contests, drillAnswers, cases, lectureBookings } }`。园所只给名单；各领域覆盖率与完成率只给中位数，且不足 3 园时为 null；不排名、无单园数、无测验分。管理员可 `?district=id:xxx|name:xxx`。'
      responses:
        '200': { description: 区县汇总 }
        '403': { description: 不是区县管理员 }
  /api/district/orgs:
    get:
      tags: [academy]
      operationId: academyDistrictOrgs
      summary: 本区园所名单（成员带区县的 ＋ 手工挂接的）
      responses:
        '200': { description: '`{ district, orgs:[{ key, name, via, members }] }`' }
    put:
      tags: [academy]
      operationId: academyDistrictAttachOrgs
      summary: 把园挂进本区
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { orgs: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string } } } } } } } } }
      responses:
        '200': { description: '`{ added, rejected:[{ i, code }], orgs }`' }
  /api/district/orgs/remove:
    post:
      tags: [academy]
      operationId: academyDistrictDetachOrg
      summary: 解除手工挂接（成员自带区县的园不能解）
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [org], properties: { org: { type: string } } } } } }
      responses:
        '200': { description: ok }
        '404': { description: 不是手工挂的 }
  /api/district/communities:
    get:
      tags: [academy]
      operationId: academyCommunities
      summary: 本区跨园共同体（区县管理员、管理员）
      description: '`{ district, communities:[{ id, name, orgs:[{ key, name }], lead, leadName, note }], free:[未编组的园], min, max }`。只有名单，没有任何一园的数。'
      responses:
        '200': { description: 共同体名单 }
        '403': { description: 不是区县管理员 }
    post:
      tags: [academy]
      operationId: academyCommunitySave
      summary: 建组或改组（2–6 所本区园，一园只在一个组；可指定组长园）
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name, orgs], properties: { id: { type: string }, name: { type: string }, orgs: { type: array, items: { type: string } }, lead: { type: string }, note: { type: string } } } } } }
      responses:
        '200': { description: '`{ community }`' }
        '409': { description: 有园已在别的组 }
  /api/district/communities/delete:
    post:
      tags: [academy]
      operationId: academyCommunityDelete
      summary: 解散共同体（面向它的联合研讨题一并删）
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [id], properties: { id: { type: string } } } } } }
      responses:
        '200': { description: ok }
  /api/me/community:
    get:
      tags: [academy]
      operationId: academyMyCommunity
      summary: 我的园所在的共同体（任何成员）
      responses:
        '200': { description: '`{ community:{ id, name, orgs, lead, leadName, cases, drills } | null }`' }
  /api/me/certificates:
    get:
      tags: [academy]
      operationId: academyMyCertificates
      summary: 我的证书与三级认证的进度、开着的认证期次
      description: '`{ certificates:[{ id, no, label, kind, ref, at }], tool, domains, seven, backbone, cohorts, kinds }`。岗位数智应用认证与领域研修证书按记录自动判定、此时发证给编号；骨干教师认证看期次答辩结果。没有分数。'
      responses:
        '200': { description: 证书与进度 }
  /api/certificates/verify:
    get:
      tags: [academy]
      operationId: academyCertificateVerify
      summary: 核验证书编号（公开；只回证书名、脱敏姓名、园所、日期）
      parameters: [{ name: no, in: query, required: true, schema: { type: string } }]
      responses:
        '200': { description: '`{ valid:true, no, label, name, orgName, at }`' }
        '404': { description: '`{ valid:false }`' }
  /api/org/certificates:
    get:
      tags: [academy]
      operationId: academyOrgCertificates
      summary: 本园证书（园长、管理员）：人名、级别、日期；无分数
      responses:
        '200': { description: '`{ org, counts:{ tool, domain, backbone }, certificates }`' }
  /api/cohorts:
    get:
      tags: [academy]
      operationId: academyCohorts
      summary: 认证期次（骨干教师认证按学期开班）
      responses:
        '200': { description: '`{ cohorts:[{ id, name, term, applyFrom, applyTo, defenseAt, place, phase, applicants, passed, mine, list? }], canHost }`' }
    post:
      tags: [academy]
      operationId: academyCohortSave
      summary: 开班或改（管理员）
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name, term], properties: { id: { type: string }, name: { type: string }, term: { type: string }, applyFrom: { type: number }, applyTo: { type: number }, defenseAt: { type: number }, place: { type: string }, note: { type: string } } } } } }
      responses:
        '200': { description: '`{ cohort }`' }
  /api/cohorts/apply:
    post:
      tags: [academy]
      operationId: academyCohortApply
      summary: 报名（报名窗口内；要三条领域研修证书 ＋ 一份入库案例）
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [id], properties: { id: { type: string }, note: { type: string } } } } } }
      responses:
        '200': { description: '`{ cohort }`' }
        '400': { description: 不在窗口或条件不够 }
  /api/cohorts/result:
    post:
      tags: [academy]
      operationId: academyCohortResult
      summary: 记答辩结果（管理员）；通过即发骨干教师认证
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [id, uid, result], properties: { id: { type: string }, uid: { type: string }, result: { type: string, enum: [pass, fail, absent] }, note: { type: string } } } } } }
      responses:
        '200': { description: '`{ cohort }`' }
  /api/cohorts/close:
    post:
      tags: [academy]
      operationId: academyCohortClose
      summary: 结班（管理员）
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [id], properties: { id: { type: string } } } } } }
      responses:
        '200': { description: '`{ cohort }`' }
  /api/questions:
    get:
      tags: [academy]
      operationId: academyQuestions
      summary: 答疑：我的提问、我能答的队列、本关已答（?level=）
      description: '`{ mine, queue, faq, canAnswer, assistantConfigured, escalated }`。每条带 `assistant`（归类、概括、草稿、把握、材料）与 `answers`。队列：本园种子教师 / 园长 / 点评人看本园开放的，带教教师看所带的，管理员（本地讲师）看全部，两个工作日没人答的 `escalated` 排前。'
      responses:
        '200': { description: 问答列表 }
    post:
      tags: [academy]
      operationId: academyQuestionAsk
      summary: 提问（带关卡）；助手立刻整理，接了模型就起草，问题同时进本园种子教师队列
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [levelId, text], properties: { levelId: { type: string }, text: { type: string } } } } } }
      responses:
        '200': { description: '`{ question, assistantConfigured }`' }
        '429': { description: 开放中的提问已有五条 }
  /api/questions/similar:
    get:
      tags: [academy]
      operationId: academyQuestionSimilar
      summary: 问之前先看看：相似的已答问题与相关案例
      parameters: [{ name: levelId, in: query, schema: { type: string } }, { name: q, in: query, required: true, schema: { type: string } }]
      responses:
        '200': { description: '`{ sources:[{ kind, id, title, text }] }`' }
  /api/questions/one:
    get:
      tags: [academy]
      operationId: academyQuestionOne
      summary: 一条提问（本人、能答的人、本园或共同体看已答的）
      parameters: [{ name: id, in: query, required: true, schema: { type: string } }]
      responses:
        '200': { description: '`{ question, sources }`' }
  /api/questions/answer:
    post:
      tags: [academy]
