      description: '`{ id, note? }`，一人一门记一次；分享者在成果上看得到谁用过。'
      responses:
        '200': { description: '`{ work }`' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: gymsid
      description: |
        HMAC-signed session cookie, set by `register/verify` / `login/verify`.
        On HTTPS deployments it is issued as **`__Host-gymsid`** (host-locked,
        Secure); the unprefixed `gymsid` is what a plain-http `localhost` instance
        uses, and is still accepted for pre-upgrade sessions. HttpOnly + SameSite=Lax;
        browser clients never handle the value directly.
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        The same signed session token, carried as `Authorization: Bearer <token>` by
        the paired mobile app (obtained from `POST /api/pair/redeem`). Bearer requests
        skip the CSRF origin check; a browser never attaches this header on its own.

  responses:
    Unauthorized:
      description: No session, expired/revoked session, or a disabled account.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "not signed in" }
    Forbidden:
      description: Signed in, but not an admin. The attempt is recorded in the audit log.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "forbidden" }
    CoachOff:
      description: >-
        The Coach is not set up on this instance (switched off, or no provider connected).
        Every Coach route answers this rather than pretending, so an unconfigured instance
        renders exactly the app it was before the feature existed. `code` is `off`, the
        class a job refused at enqueue for the same reason carries; the app shows its own
        line for it.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              code: { type: string, enum: [off] }
          example: { error: "the Coach is not set up on this instance", code: off }
    CoachJobQueued:
      description: >-
        Queued. The job runs in the background; its outcome arrives through
        `GET /api/coach/status`, which the client polls.
      content:
        application/json:
          schema:
            type: object
            properties:
              job:
                type: object
                properties:
                  id: { type: string, description: 16 hex characters. }
          example: { job: { id: "9f1c2d3e4a5b6c7d" } }
    CoachRefused:
      description: |
        The Coach will not take this job, and says which reason in `code`:

        - `busy` (409): a job for this profile is already running.
        - `shared` (409): instance mode, and the credential belongs to another profile.
        - `cap` (429): this profile's or the instance's daily limit is spent.
        - `consent` (403): no consent recorded for this profile.
        - `unprivileged` (503): the privilege drop cannot be performed, so no job runs.

        The message is the one to show; the raw provider detail never reaches the user.
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              code: { type: string, enum: [off, busy, cap, consent, shared, unprivileged] }
          example: { error: "the Coach is already thinking about your training", code: busy }
    TooManyRequests:
      description: >-
        Paused by the sign-in throttle (see *Throttling* in the description). The request
        was not looked at; try again after `Retry-After` seconds.
      headers:
        Retry-After:
          description: Seconds until the pause ends.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "too many attempts, try again later", code: "locked", retryAfter: 60 }
    Busy:
      description: Every password check slot and the short queue behind them are taken.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "the server is busy, try again in a moment", code: "busy" }
    PasswordPolicy:
      description: >-
        The new password breaks the policy (`too-short` under 10 characters,
        `too-long` over 256, or `too-common`), or a field is `missing`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "this password is too easy to guess", code: "too-common" }
    NameTaken:
      description: >-
        Another profile already signs in with this name, or holds it with a reset code
        that has not been used or expired yet.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "another profile already signs in with this name", code: "name-taken" }

    ProofRefused:
      description: >-
        No acceptable proof that the owner is here: `passkey-required` (no password that
        counts, because none is set or `PASSWORD_LOGIN` is off, so a passkey has to confirm),
        `passkey` (the assertion did not verify, belongs to another profile, or was made
        for another challenge, one handed out for another ceremony or one already used),
        `current-required` or `current-wrong`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "confirm with your passkey first", code: "passkey-required" }
    PasskeyLimit:
      description: The profile already has the most passkeys it can have (20).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "a profile can have at most 20 passkeys", code: "passkey-limit" }
    LinkInvalid:
      description: >-
        The code is wrong, used, replaced or expired, or its profile is gone or disabled:
        one answer for all of them.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: "that code is wrong, used or expired", code: "link-invalid" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable message. This is the only error shape the API has.
        code:
          type: string
          description: >-
            A stable reason on the password, throttle and media routes, for a client to word
            in its own language (`bad-credentials`, `locked`, `too-short`, `media-quota`, …).
            Media refusals add the numbers to word it with (`maxMB`, `maxSec`, `usedMB`,
            `quotaMB`).
        retryAfter:
          type: integer
          description: 429 only. The same number of seconds as the Retry-After header.

    Ok:
      type: object
      properties:
        ok: { type: boolean, const: true }

    PasskeyList:
      type: object
      properties:
        passkeys:
          type: array
          items:
            type: object
            properties:
              id: { type: string, description: WebAuthn credential id (base64url). }
              name: { oneOf: [{ type: string }, { type: 'null' }] }
              created: { oneOf: [{ type: string }, { type: 'null' }], description: ISO timestamp. }
              lastUsed: { oneOf: [{ type: string }, { type: 'null' }], description: 'ISO timestamp of the last sign-in or confirmation with it.' }
              transports: { type: array, items: { type: string } }
        password:
          type: boolean
          description: >-
            The profile has a password and `PASSWORD_LOGIN` is on, so `current` can prove
            an addition or a removal.
        lastWayIn:
          type: boolean
          description: Removing any one passkey would be refused (409 `last-way-in`).
      example:
        passkeys: [{ id: "g3Xq…", name: "Laptop", created: "2026-09-23T10:00:00.000Z", lastUsed: "2026-09-23T10:00:00.000Z", transports: [internal] }]
        password: false
        lastWayIn: true

    OwnerProof:
      type: object
      description: >-
        Either a passkey assertion made for this request (`cid` + `credential`), or the
        profile's current password (`current`), which counts only while `PASSWORD_LOGIN`
        is on. Each assertion is good for one request: its challenge is spent by it.
      properties:
        cid: { type: string, description: 'From POST /api/login/options.' }
        credential: { $ref: '#/components/schemas/WebAuthnAuthenticationCredential' }
        current: { type: string }

    SessionUser:
      type: object
      description: The caller's identity, as returned by /api/me and the sign-in routes.
      properties:
        id: { type: string, description: Stable user id (16 base64url chars). }
        name: { type: string }
        admin: { type: boolean }
      example: { id: "Zk3q9XyPbA2LmN0v", name: "Ada", admin: false }

    # ------------------------------------------------------------------ WebAuthn
    # These mirror @simplewebauthn/server v13's JSON shapes (themselves the W3C
    # WebAuthn Level 3 JSON serialization). Clients normally never build them by
    # hand; @simplewebauthn/browser converts them to/from the navigator.credentials
    # calls. Documented loosely on purpose; the library owns the details.
    WebAuthnRegistrationOptions:
      type: object
      description: >-
        PublicKeyCredentialCreationOptionsJSON. Pass to
        `startRegistration()` (@simplewebauthn/browser) or decode for
        `navigator.credentials.create()`. Resident keys are required; attestation
        is `none`.
      properties:
        challenge: { type: string, description: base64url }
        rp:
          type: object
          properties:
            name: { type: string }
            id: { type: string, description: The RP_ID the instance is configured with. }
        user:
          type: object
          properties:
            id: { type: string, description: base64url user handle }
            name: { type: string }
            displayName: { type: string }
        pubKeyCredParams: { type: array, items: { type: object } }
        authenticatorSelection:
          type: object
          properties:
            residentKey: { type: string, const: required }
            userVerification: { type: string, const: preferred }
        attestation: { type: string, const: none }
      additionalProperties: true

    WebAuthnRegistrationCredential:
      type: object
      description: >-
        RegistrationResponseJSON: the value `startRegistration()` resolves with
        (the created credential plus the authenticator's attestation response),
        sent back verbatim.
      properties:
        id: { type: string, description: base64url credential id }
        rawId: { type: string }
        type: { type: string, const: public-key }
        response:
          type: object
          properties:
            clientDataJSON: { type: string, description: base64url }
            attestationObject: { type: string, description: base64url }
            transports:
              type: array
              items: { type: string }
              description: e.g. ["internal", "hybrid"], stored for later logins.
          additionalProperties: true
      additionalProperties: true

    WebAuthnAuthenticationOptions:
      type: object
      description: >-
        PublicKeyCredentialRequestOptionsJSON. Pass to `startAuthentication()`.
        `allowCredentials` is empty: the browser offers the user's discoverable
        passkeys itself.
      properties:
        challenge: { type: string, description: base64url }
        rpId: { type: string }
        userVerification: { type: string, const: preferred }
        allowCredentials: { type: array, items: { type: object }, description: Always empty. }
      additionalProperties: true

    WebAuthnAuthenticationCredential:
      type: object
      description: >-
        AuthenticationResponseJSON: the value `startAuthentication()` resolves
        with, sent back verbatim.
      properties:
        id: { type: string, description: base64url credential id }
        rawId: { type: string }
        type: { type: string, const: public-key }
        response:
          type: object
          properties:
            clientDataJSON: { type: string }
            authenticatorData: { type: string }
            signature: { type: string }
            userHandle: { type: string }
          additionalProperties: true
      additionalProperties: true

    # ------------------------------------------------------------------ state sync
    State:
      type: object
      description: |
        The whole app state as one blob. The server treats it as opaque (it only
        strips `active` on save and reads a few fields for reminders and the admin
        dashboard). The schema below is **representative, not enforced** (except
        `workouts` and `routines`, which must be arrays (or null) when present), and grows
        with the app. Concurrent writes are caught by the server's revision (`_rev`,
        see PUT /api/data); the client merges the two documents and decides by `_ts`
        which side's settings win.
      properties:
        _ts:
          type: number
          description: Client-set last-write timestamp (ms since epoch); drives sync.
        _rev:
          type: integer
          readOnly: true
          description: Server-set revision, incremented on every accepted PUT. Ignored when sent by a client.
        _wid:
          type: string
          readOnly: true
          description: Server-set id of this write (16 hex characters), new on every accepted PUT.
        _wids:
          type: array
          readOnly: true
          items: { type: string }
          description: The write ids of the documents this one descends from, oldest first (up to 50).
        deleted:
          type: object
          description: >-
            When entries were removed, per list and entry key ({ workouts: { <id>: ms } }, weigh-ins
            by day, favourites by exercise id). A negative stamp is an add-back after a removal.
            Never shrinks on the server; stamped for writers that do not stamp (see PUT /api/data).
          additionalProperties: { type: object, additionalProperties: { type: number } }
        edited:
          type: object
          description: >-
            When each setting and plan day was last changed, ms ({ queue: ms, 'week.3': ms, … }).
            Never shrinks on the server; stamped for writers that do not stamp (see PUT /api/data).
          additionalProperties: { type: number }
        unit: { type: string, enum: [kg, lb] }
        lang:
          type: string
          description: UI language code ("en", "de", "pt", …); also localizes pushes.
        theme: { type: string }
        accent: { type: string }
        workouts:
          type: array
          description: Completed workouts, chronological.
          items: { $ref: '#/components/schemas/Workout' }
        routines:
          type: array
          items: { $ref: '#/components/schemas/Routine' }
        queue:
          type: object
          nullable: true
          description: A planner's floating week {ids, since, startsOn, label}. The week's sessions as an ordered queue, the first undone one is today's. Written by an API client or by the app's own rotation feature, read by the reminder tick.
        week:
          type: object
          description: 'Weekly plan: weekday (0=Sunday … 6) → routine id.'
          additionalProperties: { type: string }
        dayPlan:
          type: object
          description: >-
            Per-date overrides: ISO date → routine id, or "rest". Wins over `week`.
          additionalProperties: { type: string }
        bodyweight:
          type: array
          items: { $ref: '#/components/schemas/BodyweightEntry' }
        customEx:
          type: array
          description: User-created exercises (id, name, muscles…).
          items: { $ref: '#/components/schemas/CustomExercise' }
        exWeights:
          type: object
          description: 'Per-exercise last/best weight memory: exercise id → {w, d}.'
          additionalProperties: { type: object, additionalProperties: true }
        reminder:
          type: object
          description: >-
            Daily "workout planned today" push. The server reads this: at `time`
            (HH:MM, in `tz`) it sends one push if a routine is planned and nothing
            was logged yet.
          properties:
            'on': { type: boolean }
            time: { type: string, example: "08:00" }
            tz:
              oneOf: [{ type: string }, { type: 'null' }]
              description: IANA zone ("Europe/Zurich"); the user's own clock.
        restSec: { type: number, description: Default rest-timer seconds. }
        effort:
          oneOf: [{ type: string, enum: [none, rir, rpe] }, { type: 'null' }]
        equipProfiles: { type: array, items: { type: object, additionalProperties: true } }
        settings:
          type: object
          description: >-
            Catch-all note: the remaining top-level keys (sound, keepAwake, gifSize,
            targetW, autoBackup, …) are flat settings values like the ones above.
          additionalProperties: true
      additionalProperties: true

    CustomExercise:
      type: object
      description: >-
        One exercise the user made (representative shape). The server stores it as sent and
        reads only `media` from it, to know which uploaded files are still referenced.
      properties:
        id: { type: string }
        n: { type: string, description: Name. }
        bp: { type: string, description: Body part. }
        custom: { type: boolean, const: true }
        media:
          $ref: '#/components/schemas/MediaRef'
        url:
          type: string
          format: uri
          maxLength: 2048
          description: >-
            One link: a video or a guide. http(s) only, no credentials. Neither the app nor
            the server ever fetches it: the app opens it in a new browsing context on a tap.
        _ts: { type: number, description: 'When this entry was last edited, ms, for merging two devices'' copies.' }
      additionalProperties: true

    MediaRef:
      type: object
      description: >-
        What the state knows of an uploaded file. The bytes are behind
        `GET /api/media/{hash}`; the server keeps a file as long as some `customEx[].media.hash`,
        `workouts[].media[].hash` or `.poster.hash` of either in the profile's state names it, and
        for `MEDIA_GC_GRACE_DAYS` after.
      required: [kind, hash, mime, size, width, height, at]
      properties:
        kind: { type: string, enum: [image, gif, video], description: '`gif` means animated; a one-frame GIF is an `image`.' }
        hash: { type: string, pattern: '^[0-9a-f]{64}$', description: SHA-256 of the stored file. }
        mime: { type: string, enum: [image/webp, image/jpeg, image/png, image/gif, video/mp4, video/quicktime, video/webm] }
        size: { type: integer, minimum: 1 }
        width: { type: integer, minimum: 1, maximum: 16384 }
        height: { type: integer, minimum: 1, maximum: 16384 }
        dur: { type: number, minimum: 0, maximum: 3600, description: 'Seconds, one decimal; videos and animated GIFs, absent when unknown.' }
        codec: { type: string, enum: [avc1, hvc1, av01, vp09, vp8, vp9, other], description: Videos only. }
        poster:
          type: object
          description: A still of at most 480 px, always for images and GIFs, when possible for videos.
          properties:
            hash: { type: string, pattern: '^[0-9a-f]{64}$' }
            mime: { type: string, enum: [image/webp, image/jpeg] }
            size: { type: integer }
            width: { type: integer }
            height: { type: integer }
        at: { type: number, description: When it was attached, ms. }

    MediaConfig:
      type: object
      description: >-
        The instance's media caps (`MEDIA_*`), in MB of 2^20 bytes. Absent when the instance
        runs with `MEDIA_UPLOADS=0`.
      properties:
        imageMB: { type: number, description: 'A photo after the app re-encoded it, or a poster.' }
        gifMB: { type: number }
        videoMB: { type: number }
        videoSec: { type: number }
        quotaMB: { type: number, description: Per profile; 0 = no cap. }
        workouts:
          type: boolean
          const: true
          description: >-
            This instance keeps the files a logged workout's `media` list names too, not only a
            custom exercise's. Absent on an instance from before; the app then offers photos and
            videos on custom exercises only.
      example: { imageMB: 2, gifMB: 8, videoMB: 40, videoSec: 60, quotaMB: 200, workouts: true }

    MediaUsage:
      type: object
      properties:
        bytes: { type: integer, description: What the profile's stored files take. }
        count: { type: integer }
        quotaBytes: { type: integer, description: The cap; 0 = no cap. }

    MediaStored:
      type: object
      properties:
        ok: { type: boolean, const: true }
        hash: { type: string }
        mime: { type: string, description: 'What the bytes are, not necessarily what was declared.' }
        size: { type: integer }
        existed: { type: boolean, description: The server already had this file. }

    Workout:
      type: object
      description: One completed workout (representative shape).
      properties:
        id: { type: string }
        d: { type: string, format: date, description: 'ISO day, e.g. "2026-08-30".' }
        start: { type: number, description: ms since epoch }
        end: { type: number }
        routineId: { type: string }
        name: { type: string }
        bw: { type: number, description: 'Body weight that day, in `unit`.' }
        vol: { type: number, description: Total volume (Σ weight × reps). }
        prs:
          type: array
          items: { type: string }
          description: Exercise ids that hit a personal record.
        entries:
          type: array
          items:
            type: object
            properties:
              id: { type: string, description: Exercise id. }
              topW: { oneOf: [{ type: number }, { type: 'null' }] }
              sets:
                type: array
                items:
                  type: object
                  properties:
                    w: { type: number, description: Weight. }
                    r: { type: number, description: Reps. }
                    done: { type: boolean }
                    rir: { type: number }
                    rpe: { type: number }
                  additionalProperties: true
            additionalProperties: true
        media:
          type: array
          maxItems: 6
          items:
            $ref: '#/components/schemas/MediaRef'
          description: >-
            Photos and videos attached to this workout (a progress photo, a form-check clip),
            at most six in the app. Refs only; the bytes are behind `/api/media/{hash}`, and the
            server keeps every file any entry here names (the GC walks this list as it walks
            each custom exercise's `media`).
        _ts: { type: number, description: 'When this workout was last edited after it was logged, ms, for merging two devices'' copies.' }
      additionalProperties: true

    Routine:
      type: object
      description: A workout template (representative shape).
      properties:
        id: { type: string }
        name: { type: string }
        emoji: { type: string }
        ex:
          type: array
          description: Exercises with set/rep targets.
          items: { type: object, additionalProperties: true }
      additionalProperties: true

    BodyweightEntry:
      type: object
      properties:
        d: { type: string, format: date }
        w: { type: number, description: Weight in `unit`. }
        t: { type: number, description: Timestamp (ms). }
      additionalProperties: true

    # ------------------------------------------------------------------ push
    PushSubscription:
      type: object
      description: The browser's PushSubscription.toJSON(); only these fields are stored.
      required: [endpoint, keys]
      properties:
        endpoint:
          type: string
          format: uri
          description: Public https:// push-service URL.
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string }
            auth: { type: string }

    # ------------------------------------------------------------------ admin
    AdminUserRow:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        created: { oneOf: [{ type: string }, { type: 'null' }], description: ISO timestamp. }
        disabled: { type: boolean }
        admin: { type: boolean }
        invitedBy:
          oneOf: [{ type: string }, { type: 'null' }]
          description: The invite code this account was created with.
        workouts: { type: integer, description: Total logged workouts. }
        lastWorkout:
          oneOf: [{ type: string }, { type: 'null' }]
          description: ISO day of the newest workout.
        lastSync:
          oneOf: [{ type: number }, { type: 'null' }]
          description: The state's `_ts` (ms).
        hasPush: { type: boolean, description: Has at least one push subscription. }
        live:
          oneOf: [{ $ref: '#/components/schemas/Presence' }, { type: 'null' }]
          description: Currently training, or null.
        password:
          type: boolean
          description: PASSWORD_LOGIN instances only. The profile has a password.
        email:
          oneOf: [{ type: string }, { type: 'null' }]
          description: PASSWORD_LOGIN instances only. The e-mail the profile signs in with, if any.

    Presence:
      type: object
      description: Live-workout snapshot (from /api/activity heartbeats).
      properties:
        name: { type: string }
        exIdx: { type: integer }
        exTotal: { type: integer }
        setsDone: { type: integer }
        setsTotal: { type: integer }
        startedAt: { type: number }
        updatedAt: { type: number }

    AdminUserDetail:
      type: object
      properties:
        user:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            created: { oneOf: [{ type: string }, { type: 'null' }] }
            disabled: { type: boolean }
            admin: { type: boolean }
            invitedBy: { oneOf: [{ type: string }, { type: 'null' }] }
            password: { type: boolean, description: PASSWORD_LOGIN instances only. }
            email:
              oneOf: [{ type: string }, { type: 'null' }]
              description: PASSWORD_LOGIN instances only. The sign-in e-mail, if any.
            resetUntil:
              oneOf: [{ type: number }, { type: 'null' }]
              description: PASSWORD_LOGIN instances only. Expiry (ms) of an unused reset code.
        unit: { type: string, enum: [kg, lb] }
        lastSync: { oneOf: [{ type: number }, { type: 'null' }] }
        routines:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              emoji: { type: string }
              count: { type: integer, description: Number of exercises. }
        bodyweight:
          type: array
          items: { $ref: '#/components/schemas/BodyweightEntry' }
        workouts:
          type: array
          description: Full history, newest first.
          items: { $ref: '#/components/schemas/Workout' }

    Invite:
      type: object
      properties:
        code: { type: string, description: 16 hex chars. }
        note: { type: string }
        createdBy: { type: string, description: Admin user id. }
        created: { type: string, description: ISO timestamp. }
        usedBy:
          oneOf: [{ type: string }, { type: 'null' }]
          description: User id that redeemed the code (absent/null while unused).
        usedAt: { type: string }
        usedByName:
          oneOf: [{ type: string }, { type: 'null' }]
          description: Resolved display name (only in GET /api/admin/invites).
      additionalProperties: true

    AuditEvent:
      type: object
      description: One line of the audit log.
      required: [id, ts, ev, ok]
      properties:
        id:
          type: integer
          description: Monotonic, never reset; a cleared log leaves a visible id gap.
        ts: { type: number, description: ms since epoch. }
        ev:
          type: string
          description: |
            Event name. Currently one of:
            `auth.register.ok|fail|denied`, `auth.login.ok|fail`, `auth.logout`,
            `auth.logout.all`, `auth.pair.create|ok|fail`,
            `admin.denied`, `admin.user.disable|enable`,
            `admin.invite.create|revoke`, `admin.audit.clear`.
        ok: { type: boolean, description: false for failed/denied attempts. }
        uid: { type: string, description: Acting (or affected) user id. }
        name: { type: string, description: Acting user's name (max 40 chars). }
        tgt: { type: string, description: Target user id (admin actions). }
        tname: { type: string, description: Target user's name. }
        msg:
          type: string
          description: >-
            Short detail: a failure reason code, or the invite code involved.
            Rejected invite guesses and unknown credential ids are deliberately
            never recorded.
        ip:
          type: string
          description: >-
            Only when AUDIT_IP is on: the full address (`full`) or just the
            network, /24 or /48 (`net`).
      example:
        id: 421
        ts: 1756500000000
        ev: auth.login.ok
        ok: true
        uid: Zk3q9XyPbA2LmN0v
        name: Ada

    # ------------------------------------------------------------------ AI Coach
    CoachCap:
      type: object
      description: What this profile has spent of its daily allowance.
      properties:
        used: { type: integer }
        limit: { type: integer, description: 0 means no per-profile cap. }

    CoachStatus:
      type: object
      properties:
        job:
          oneOf:
            - type: object
              properties:
                id: { type: string }
                kind: { type: string, enum: [create, review, debrief] }
                state: { type: string, enum: [queued, running] }
                startedAt: { type: integer, description: Epoch ms. }
            - type: 'null'
          description: The job running now, or null. One at a time per profile.
        pending:
          oneOf:
            - $ref: '#/components/schemas/CoachProposal'
            - type: 'null'
        cap: { $ref: '#/components/schemas/CoachCap' }
        maxMessageLen:
          type: integer
          minimum: 200
          maximum: 4000
          description: |
            The longest note or refinement this instance keeps, in characters. It rides on the
            poll so a chat that is already open follows an admin's change.
        last:
          oneOf:
            - type: object
              description: How the most recent job ended, so the chat can say so in the Coach's own voice.
              properties:
                id: { type: string }
                kind: { type: string, enum: [create, review, debrief] }
                outcome: { type: string, enum: [ready, nochange, applied, dismissed, expired, failed] }
                errorClass:
                  oneOf: [{ type: string }, { type: 'null' }]
                  description: e.g. `provider`, `unusable`, `restart`, `forgotten`, `consent`, `noworkout`.
                at: { type: integer, description: Epoch ms. }
                reading: { type: string, description: "Present on `nochange`: why there was nothing to change." }
            - type: 'null'

    CoachProposal:
      type: object
      description: |
        The answer waiting for a decision, from whichever kind of job produced it. It
        expires 14 days after it was made; the first status poll after that retires it.
        `changes` comes from a review, `bundle` from a plan, `score`/`highlights` from a
        debrief. One of the three, never more.
      properties:
        id: { type: string, description: The job's id. }
        kind: { type: string, enum: [create, review, debrief] }
        createdAt: { type: integer, description: Epoch ms. }
        expiresAt: { type: integer, description: Epoch ms. }
        planHash: { type: string, description: The plan this was written against. A later edit makes it stale. }
        iteration: { type: integer, description: "1, or higher after a refine." }
        summary: { type: string, maxLength: 1200 }
        changes:
          type: array
          description: A review's change-set, each one applied or rejected on its own.
          items:
            type: object
            properties:
              id: { type: string }
              type:
                type: string
                enum: [add-exercise, remove-exercise, swap-exercise, sets, reps, repsMin, repsMax,
                       sec, cardio, reorder, superset, routine-prog, exercise-prog, inc,
                       add-routine, remove-routine, rename-routine, week]
              why: { type: string }
              before: { description: What the plan says now. The client checks it before applying. }
              after: { description: What it would say. }
            additionalProperties: true
        evidence:
          type: object
          description: The window the review read.
          properties:
            from: { oneOf: [{ type: string }, { type: 'null' }] }
            to: { oneOf: [{ type: string }, { type: 'null' }] }
            sessions: { oneOf: [{ type: integer }, { type: 'null' }] }
        notes:
          type: array
          items: { type: string }
        bundle:
          type: object
          description: A whole plan, from a `create` job (routines, week and any custom exercises).
          properties:
            opengym_plan: { type: integer, const: 1 }
            name: { type: string, maxLength: 40 }
            summary: { type: string }
            basedOn: { type: string }
            week: { type: object }
            routines: { type: array, items: { type: object } }
            customEx: { type: array, items: { type: object } }
          additionalProperties: true
        score: { type: integer, minimum: 1, maximum: 10, description: A debrief's score for the session. }
        highlights: { type: array, items: { type: string } }
        watch: { type: array, items: { type: string } }
        nextTime: { type: array, items: { type: string } }
        workout:
          type: object
          description: Which session a debrief read.
          additionalProperties: true
      additionalProperties: true

    CoachIntake:
      type: object
      description: >-
        The intake answers, as the plan screen collects them. Stored in the profile's own
        state as well; sent here so a plan can be asked for with answers that have not
        been synced yet.
      properties:
        goal: { type: string, description: "e.g. `muscle`, `strength`, `fat-loss`." }
        experience: { type: string }
        daysPerWeek: { type: integer }
        preferredDays: { type: array, items: { type: integer }, description: 0 = Sunday. }
        sessionMin: { type: integer, description: Minutes per session. }
        equipment: { type: array, items: { type: string } }
        limitations: { type: string, description: Injuries and anything to work around. }
      additionalProperties: true

    CoachCohort:
      type: object
      description: |
        Medians across the profiles that opted in, and where this one stands among them.
        `ok` is false whenever there is nothing to show, and the other flags say why:
        the admin has the comparison switched off (`enabled: false`), this profile does
        not share (`sharing: false`), or there are not yet three who do.
      properties:
        ok: { type: boolean }
        enabled: { type: boolean }
        sharing: { type: boolean }
        people: { type: integer }
        minPeople: { type: integer, description: Three. Below it nothing is computed at all. }
        unit: { type: string, enum: [kg, lb], description: The reader's own unit. Every number below is in it. }
        sessionsPerWeek:
          type: object
          properties:
            median: { type: number }
            you: { type: number }
        exercises:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              people: { type: integer }
              median: { oneOf: [{ type: number }, { type: 'null' }] }
              you: { oneOf: [{ type: number }, { type: 'null' }] }
        rankPct:
          oneOf: [{ type: integer }, { type: 'null' }]
          description: Share of the others at or below this profile, averaged over the listed exercises.

    AdminCoach:
      type: object
      description: The whole admin card in one answer. Never a credential, only whether one is filed.
      properties:
        disabledByEnv: { type: boolean, description: "COACH_DISABLED is set, so nothing the admin toggles matters." }
        enabled: { type: boolean }
        provider: { type: string }
        providers:
          type: array
          description: Every provider this build knows, and what each one needs.
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
              runtime: { type: string, description: "The runtime it spawns, when it spawns one." }
              setupToken: { type: boolean }
              deviceLogin: { type: boolean }
              apiKey: { type: boolean }
              http: { type: boolean }
              baseUrl: { type: boolean, description: Whether its endpoint is configurable. }
              keyOptional: { type: boolean }
              keyPlaceholder: { oneOf: [{ type: string }, { type: 'null' }] }
              defaultModel: { oneOf: [{ type: string }, { type: 'null' }] }
              connected: { type: boolean, description: Whether a credential is already filed for it. }
        model: { type: string, description: The model in force for the active provider. }
        models: { type: object, description: Model per provider. Switching provider keeps them all. }
        baseUrl: { oneOf: [{ type: string }, { type: 'null' }] }
        knownModels:
          oneOf: [{ type: array, items: { type: string } }, { type: 'null' }]
          description: From the live check, when the provider could be asked.
        caps:
          type: object
          properties:
            perProfileDaily: { type: integer }
            instanceDaily: { type: integer }
        maxMessageLen: { type: integer, description: 'How long a chat message, refinement or review note can be (200–4000, default 1000).' }
        community: { type: boolean }
        runtime:
          type: object
          description: The live check performed while answering this request.
          properties:
            ok: { type: boolean }
            version: { oneOf: [{ type: string }, { type: 'null' }] }
            error: { oneOf: [{ type: string }, { type: 'null' }] }
            needsKey: { type: boolean }
        authMode: { type: string, enum: [instance, profile] }
        boundUid:
          oneOf: [{ type: string }, { type: 'null' }]
          description: The profile an instance credential bound itself to, once one has spent it.
        auth:
          type: object
          description: >-
            Whether a credential is filed, and whose. `unreadable` is its own state because it
            has a specific cause and a specific fix: ./data restored without its `secret`.
          properties:
            state: { type: string, enum: [not-required, none, optional, connected, unreadable] }
            type: { oneOf: [{ type: string }, { type: 'null' }] }
            account: { oneOf: [{ type: string }, { type: 'null' }] }
            connectedAt: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        unprivileged:
          type: object
          description: >-
            Whether the privilege drop can be performed. It fails closed: if `ok` is false no
            job runs at all, and the admin needs to hear that here rather than from a user.
          properties:
            ok: { type: boolean }
            dropped: { type: boolean }
            why: { type: string }
        jobsToday: { type: integer }
        lastSuccess: { oneOf: [{ type: string, format: date-time }, { type: 'null' }] }
        lastError: { description: "The last failure the instance log recorded, or null." }
        recent:
          type: array
          description: The last 20 jobs, newest first. Counts and outcomes only, never contents.
          items:
            type: object
            properties:
              at: { type: string, format: date-time }
              kind: { type: string }
              trigger: { type: string, enum: [manual, scheduled] }
              outcome: { type: string }
              errorClass: { oneOf: [{ type: string }, { type: 'null' }] }
              ms: { type: integer }
