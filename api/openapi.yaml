        '200': { description: '`{ camp }`' }
  /api/camps/post:
    post:
      tags: [academy]
      operationId: academyCampPost
      summary: 发当天的小任务（一人一天一帖，再发就是改）
      description: `{ id, day, text ≥ 20 }`；只能发到今天为止。
      responses:
        '200': { description: '`{ camp }`' }
  /api/camps/close:
    post:
      tags: [academy]
      operationId: academyCloseCamp
      summary: 结营：讲师总评；发过帖的营员记为结营，成长勋章由荣誉页按此发
      description: `{ id, summary ≥ 20 }`
      responses:
        '200': { description: '`{ camp }`' }
  /api/studytasks:
    get:
      tags: [academy]
      operationId: academyStudyTasks
      summary: 园内教研组任务（本园）：先交再看别人的
      description: 谁没交只有出题人看到，不推送催交。
      responses:
        '200': { description: '`{ tasks, canHost, minReply }`' }
  /api/studytasks:
    post:
      tags: [academy]
      operationId: academySaveStudyTask
      summary: 教研主任（点评人）或园长发课例研讨任务，可挂一条入库案例
      description: `{ id?, title, prompt, caseId?, dueAt? }`
      responses:
        '200': { description: '`{ task }`' }
  /api/studytasks/reply:
    post:
      tags: [academy]
      operationId: academyStudyReply
      summary: 交反思（≥ 100 字，截止前可改）；记进「反思与发展」领域证据
