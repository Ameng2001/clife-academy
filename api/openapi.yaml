      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name, hostUid], properties: { id: { type: string }, name: { type: string }, focus: { type: string }, term: { type: string }, intro: { type: string }, hostUid: { type: string }, closed: { type: boolean } } } } } }
      responses:
        '200': { description: '`{ studio }`' }
  /api/studios/apply:
    post:
      tags: [academy]
      operationId: academyStudioApply
      summary: 申请加入（要有骨干教师认证）
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [id], properties: { id: { type: string }, note: { type: string } } } } } }
      responses:
        '200': { description: '`{ studio }`' }
  /api/studios/members:
    post:
      tags: [academy]
      operationId: academyStudioMembers
      summary: 成员管理（主持人）：accept / decline / add / remove；加入授「名师工作室成员」称号
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [id, uid, action], properties: { id: { type: string }, uid: { type: string }, action: { type: string, enum: [accept, decline, add, remove] }, reason: { type: string } } } } } }
      responses:
        '200': { description: '`{ studio }`' }
  /api/studios/cases:
    post:
      tags: [academy]
      operationId: academyStudioCases
      summary: 收录工作室产出（主持人；成员的已入库案例）
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [id, caseIds], properties: { id: { type: string }, caseIds: { type: array, items: { type: string } } } } } } }
      responses:
        '200': { description: '`{ studio }`' }
  /api/showcases:
    get:
      tags: [academy]
      operationId: academyShowcases
      summary: 市级展示列表（全平台）：上台作品与名师点评，没有分数与名次
      responses:
        '200': { description: '`{ showcases, canHost, studios }`' }
    post:
      tags: [academy]
      operationId: academyShowcaseSave
      summary: 建 / 改市级展示（工作室主持人）
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [studioId, title], properties: { id: { type: string }, studioId: { type: string }, year: { type: string }, title: { type: string }, theme: { type: string }, at: { type: integer }, place: { type: string }, note: { type: string } } } } } }
      responses:
        '200': { description: '`{ showcase }`' }
  /api/showcases/one:
    get:
      tags: [academy]
      operationId: academyShowcaseOne
      summary: 一场市级展示；主持人多看候选池（各共同体赛入选作品 ＋ 工作室产出）
      parameters: [{ name: id, in: query, required: true, schema: { type: string } }]
      responses:
        '200': { description: '`{ showcase }`' }
  /api/showcases/entries:
    post:
      tags: [academy]
      operationId: academyShowcaseEntries
      summary: 定上台作品与顺序（主持人，最多 12 件）
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [id, caseIds], properties: { id: { type: string }, caseIds: { type: array, items: { type: string } } } } } } }
      responses:
        '200': { description: '`{ showcase }`' }
  /api/showcases/comment:
    post:
      tags: [academy]
      operationId: academyShowcaseComment
      summary: 名师点评一件上台作品（主持人；对作品不对人）
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [id, caseId, text], properties: { id: { type: string }, caseId: { type: string }, text: { type: string } } } } } }
      responses:
        '200': { description: '`{ showcase }`' }
  /api/showcases/sharer:
    post:
      tags: [academy]
      operationId: academyShowcaseSharer
      summary: 授「年度分享者」称号（主持人；只能授上台作品作者，留理由）
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [id, uid, reason], properties: { id: { type: string }, uid: { type: string }, reason: { type: string } } } } } }
      responses:
        '200': { description: '`{ showcase }`' }
  /api/showcases/close:
    post:
      tags: [academy]
      operationId: academyShowcaseClose
      summary: 收官：上台案例标「市级展示 · 年份」
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [id], properties: { id: { type: string }, summary: { type: string } } } } } }
      responses:
        '200': { description: '`{ showcase }`' }
  /api/me/portfolio:
    get:
      tags: [academy]
      operationId: academyPortfolio
      summary: 发展档案（本人全部学习与作品记录，随人走；?download=1 下载 JSON）
      description: 不含幼儿数据、不含 AI 中间判断、不含他人的测验分与点评。
      parameters: [{ name: download, in: query, schema: { type: string } }]
      responses:
        '200': { description: '`{ format, person, summary, paths, levels, submissions, cases, contests, certificates, badges, titles, credits, studios, lectures, excluded }`' }
  /api/hours/rule:
    get:
      tags: [academy]
      operationId: academyHoursRule
      summary: 学时计时规则与证明格式（全员可读）
      responses:
        '200': { description: '`{ rule, canEdit, defaults }`' }
    put:
      tags: [academy]
      operationId: academyHoursRuleSet
      summary: 改学时规则与证明格式（管理员；按与市教育局谈定的口径）
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { minutesPerHour: { type: number }, practiceExtra: { type: number }, seminarExtra: { type: number }, backboneMinutes: { type: number }, lectureCounts: { type: boolean }, roundTo: { type: number }, title: { type: string }, issuer: { type: string }, signer: { type: string }, note: { type: string } } } } } }
      responses:
        '200': { description: '`{ rule }`' }
  /api/me/hours:
    get:
      tags: [academy]
      operationId: academyHours
      summary: 本人学时预览（缺省本学年）与已出具的证明
      parameters: [{ name: from, in: query, schema: { type: integer } }, { name: to, in: query, schema: { type: integer } }]
      responses:
        '200': { description: '`{ from, to, lines, minutes, hours, rule, schoolYear, certs }`' }
  /api/me/hours/issue:
    post:
      tags: [academy]
      operationId: academyHoursIssue
      summary: 出具学时证明（同一区间只出一份；规则快照随证明保存）
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { from: { type: integer }, to: { type: integer } } } } } }
      responses:
        '200': { description: '`{ cert }`' }
        '400': { description: 区间内没有可计学时 }
  /api/me/hours/one:
    get:
      tags: [academy]
      operationId: academyHoursOne
      summary: 一份学时证明（本人，打印用）
      parameters: [{ name: id, in: query, required: true, schema: { type: string } }]
      responses:
        '200': { description: '`{ cert }`' }
  /api/hours/verify:
    get:
      tags: [academy]
      operationId: academyHoursVerify
      summary: 核验学时证明（公开，姓名脱敏）
      parameters: [{ name: no, in: query, required: true, schema: { type: string } }]
      responses:
        '200': { description: '`{ valid, no, name, orgName, from, to, hours, at, issuer }`' }
  /api/submissions/helpful:
    post:
      tags: [academy]
      operationId: academySubmissionHelpful
      summary: 提交人标点评「有帮助」（可取消）；计点评人的贡献勋章
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [id], properties: { id: { type: string }, on: { type: boolean } } } } } }
      responses:
        '200': { description: '`{ submission }`' }
  /api/drills/helpful:
    post:
      tags: [academy]
      operationId: academyDrillHelpful
      summary: 作答人标点评「有帮助」（可取消）
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [answerId], properties: { answerId: { type: string }, on: { type: boolean } } } } } }
      responses:
        '200': { description: '`{ answer }`' }
  /api/review/stats:
    get:
      tags: [academy]
      operationId: academyReviewStats
      summary: 点评时效看板：待点评、超两个工作日、近 30 天完成数与中位时长、点评队伍、答疑队列（园长本园；管理员全平台＋各园一行）
      description: 看队列与时效，不列点评人各自点了多少，不排名。
      responses:
        '200': { description: '`{ scope, pending, overdue, oldestAt, done30, medianHours, within2d, reviewers, active30, members, questions, queue, orgs? }`' }
  /api/me/checkup:
    get:
      tags: [academy]
      operationId: academyMyCheckup
      summary: 本园体检推给我这个岗位的关卡
      responses:
        '200': { description: '`{ week, recommendations, sum, limited }`' }
  /api/checkup/probes:
    get:
      tags: [academy]
      operationId: academyCheckupProbes
      summary: 12 项探针定义（给平台接口人）
      responses:
        '200': { description: '`{ probes, earlyDays }`' }
  /api/contests:
    get:
      tags: [academy]
      operationId: academyContests
      summary: 斗课（同课异构擂台）园内赛与共同体赛：进行中与已收官
      description: '`{ current, past, canHost, hostScope, communities, rubric }`。园内赛同园可见；共同体赛（`level: community`）本园在组里就可见，由区县管理员出题（`communityId`）、跨园编组，作品带 `orgName`。每场带 `phase`（open 应战 / review 互评与点评 / done 收官）、本人作品 `mine`、报名数。'
      responses:
        '200': { description: 擂台 }
    post:
      tags: [academy]
      operationId: academyContestSave
      summary: 出题或改（园长、点评人、管理员）
      description: '`{ id?, month, title, age, activity, goal, guide?, domain, dueAt?, reviewAt? }`。默认两周后截止、再一周互评。'
      responses:
        '200': { description: '`{ contest }`' }
        '403': { description: 不是主持人 }
  /api/contests/one:
    get:
      tags: [academy]
      operationId: academyContestOne
      summary: 一场的详情与作品
      description: '`?id=`。应战期间别人的设计不给看；截止后同园都能看。分数只有作者看自己的、主持人看平均分；别人看不到。'
      responses:
        '200': { description: '`{ contest }`' }
  /api/contests/delete:
    post:
      tags: [academy]
      operationId: academyContestDelete
      summary: 删一场（没收官的）
      responses:
        '200': { description: '`{ ok }`' }
  /api/contests/enter:
    post:
      tags: [academy]
      operationId: academyContestEnter
      summary: 应战或改自己的作品（应战期）
      description: '`{ id, design(≥100 字), video?:{hash,name,type}|null, note? }`。片段 ≤ 3 分钟、幼儿不露脸。'
      responses:
        '200': { description: '`{ contest }`' }
        '400': { description: 已截止，或设计太短 }
  /api/contests/rate:
    post:
      tags: [academy]
      operationId: academyContestRate
      summary: 互评（互评期、同园、不评自己）
      description: '`{ entryId, scores:[1..5 ×5], comment }`。量表：目标适切、环节设计、师幼互动、材料运用、反思。实名，一人一份。'
      responses:
        '200': { description: '`{ entry }`' }
  /api/contests/group:
    post:
      tags: [academy]
      operationId: academyContestGroup
      summary: 编组（主持人，截止后）
      description: '`{ id, groups?:[[entryId]] }`。不带 groups 按报名顺序每 3–4 人一组。'
      responses:
        '200': { description: '`{ contest }`' }
  /api/contests/review:
    post:
      tags: [academy]
      operationId: academyContestReview
      summary: 一组的「同课异构」对照点评（主持人）
      description: '`{ id, group, text(≥50 字) }`。'
      responses:
        '200': { description: '`{ contest }`' }
  /api/contests/select:
    post:
      tags: [academy]
      operationId: academyContestSelect
      summary: 定入选（主持人）
      description: '`{ id, entryIds }`。'
      responses:
        '200': { description: '`{ contest }`' }
  /api/contests/close:
    post:
      tags: [academy]
      operationId: academyContestClose
      summary: 收官：全部作品进案例库（主持人）
      description: '`{ id, summary? }`。入选的标「同课异构 · 月 · 年龄班」，其余标「参赛作品」；每份记积分（规则表 contest）。'
      responses:
        '200': { description: '`{ contest }`' }
  /api/contests/file:
    get:
      tags: [academy]
      operationId: academyContestFile
      summary: 实施片段（同园、截止后；本人随时）
      responses:
        '200': { description: 文件 }
  /api/drills:
    get:
      tags: [academy]
      operationId: academyDrills
      summary: 每周一题：开放中、已收题，出题人另见未开放的
      description: '`?q=`。`{ current, past, upcoming, canPost, postScope }`，每题带 `phase`、本人作答 `mine`、本园作答人数 `answered`、精选数 `featured`。'
      responses:
        '200': { description: 题 }
        '401': { description: 未登录 }
    post:
      tags: [academy]
      operationId: academyDrillSave
      summary: 出题或改（管理员面向全平台，园长只面向本园）
      description: '`{ id?, title(≥10 字), context?, role?, domain?, openAt?, closeAt?, scope? }`。默认今天开放、七天后收。'
      responses:
        '200': { description: '`{ drill }`' }
        '400': { description: 题干太短 }
        '403': { description: 不是管理员或园长，或不是自己出的题 }
  /api/drills/delete:
    post:
      tags: [academy]
      operationId: academyDrillDelete
      summary: 删一题（连同作答）
      responses:
        '200': { description: '`{ ok }`' }
  /api/drills/answer:
    post:
      tags: [academy]
      operationId: academyDrillAnswer
      summary: 作答或改自己的作答
      description: '`{ id, text(≥20 字) }`。一人一题一份，改了算最新；已点评的保留点评。'
      responses:
        '200': { description: '`{ drill }`' }
        '400': { description: 太短，或题还没开放 }
  /api/drills/answers:
    get:
      tags: [academy]
      operationId: academyDrillAnswers
      summary: 一题的作答（同园、自己答了才看得到；点评人与带教教师例外）
      description: '`?id=`。精选在前。`locked` 为 true 表示还没答、看不到。'
      responses:
        '200': { description: '`{ drill, answers, locked }`' }
  /api/drills/review:
    post:
      tags: [academy]
      operationId: academyDrillReview
      summary: 点评一份作答（园长、点评人、管理员，或作答人的带教教师）
      description: '`{ answerId, comment, featured? }`。一句意见，可标精选；没有分数与排名。'
      responses:
        '200': { description: '`{ answer }`' }
        '403': { description: 自己的，或不是本园 }
  /api/lectures:
    get:
      tags: [academy]
      operationId: academyLectures
      summary: 园长大讲堂：待播（含正在直播）与回放
      description: 没登录也能看。`{ upcoming, done, canEdit, remindBefore }`，每场带 `phase`（upcoming / live / done）、`booked`、`bookings`；管理员另见 `bookedBy`。
      responses:
        '200': { description: 场次 }
    post:
      tags: [academy]
      operationId: academyLectureSave
      summary: 排一场或改（管理员）
      description: '`{ id?, title, desc?, who?, speaker?, at(毫秒时间戳), minutes?, liveUrl?, replayUrl?, slides?:{url}|{file:{hash,name,type,size}}|null, notes?, caseIds?, titleIds? }`。caseIds 是这场展示的入库案例，titleIds 是这场颁发的称号。改了开播时间会重新提醒。'
      responses:
        '200': { description: '`{ lecture }`' }
        '400': { description: 缺标题 / 时间，链接格式不对，讲义文件未上传 }
        '403': { description: 不是管理员 }
  /api/lectures/delete:
    post:
      tags: [academy]
      operationId: academyLectureDelete
      summary: 删一场（管理员）
      responses:
        '200': { description: '`{ ok }`' }
  /api/lectures/book:
    post:
      tags: [academy]
      operationId: academyLectureBook
      summary: 预约或取消预约
      description: '`{ id, on }`。已结束的场次不能预约。答 `remind` 表示本人订阅过 lecture 模板、开播前 30 分钟会收到一条。'
      responses:
        '200': { description: '`{ lecture, remind }`' }
        '400': { description: 已结束 }
        '401': { description: 未登录 }
  /api/lectures/file:
    get:
      tags: [academy]
      operationId: academyLectureFile
      summary: 讲义文件
      responses:
        '200': { description: 文件 }
        '404': { description: 没有 }
  /api/resources:
    get:
      tags: [academy]
      operationId: academyResources
      summary: 资源库：文献与政策、模板与工具
      description: '`?q=&kind=policy|template|case|other&domain=`。内置的教育部文件（`seed: true`）加本园与公开的上传；没登录只看公开的。'
      responses:
        '200': { description: '`{ resources, kinds, canAdd }`' }
    post:
      tags: [academy]
      operationId: academyResourceSave
      summary: 加或改一条资源
      description: '`{ id?, kind, title, domain?, desc?, url? | file?: { hash, name, type, size }, scope: org | public }`。加：管理员、园长、点评人；改：本人、本园园长、管理员。公开范围只有园长与管理员能设。文件先 `PUT /api/media/{hash}`（只收图片与短视频），文档贴链接。'
      responses:
        '200': { description: '`{ resource }`' }
        '400': { description: 没有标题、既无链接也无文件、链接不是 http(s) }
        '403': { description: 没有权限 }
  /api/resources/delete:
    post:
      tags: [academy]
      operationId: academyResourceDelete
      summary: 删一条资源
      responses:
        '200': { description: '`{ ok }`' }
        '403': { description: 没有权限 }
        '404': { description: 没有这条 }
  /api/resources/file:
    get:
      tags: [academy]
      operationId: academyResourceFile
      summary: 资源文件
      description: '`?id=`。能看到这条资源的人都能读。'
      responses:
        '200': { description: 文件 }
        '404': { description: 没有这条或没有文件 }
